<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرافدين</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Tahoma}
.app{max-width:430px;margin:auto;background:linear-gradient(180deg,#0d1b4d,#000);min-height:100vh;padding-bottom:70px}
.header{text-align:center;padding:15px;color:#00e5ff;font-size:22px}
.card{background:#111827;margin:10px;padding:15px;border-radius:15px}
.points{font-size:45px;color:#22c55e;text-align:center;font-weight:bold}
.btn{background:linear-gradient(90deg,#2563eb,#06b6d4);color:#fff;border:0;padding:15px;width:100%;border-radius:12px;margin:8px 0;font-size:16px;cursor:pointer}
.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#0a0f1e;display:flex}
.nav button{flex:1;padding:12px;background:none;border:0;color:#aaa;font-size:12px;cursor:pointer}
.nav button.active{color:#00e5ff}
.page{display:none}.page.active{display:block}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:270px;margin:10px auto}
.cell{background:#222;height:85px;font-size:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer}
.item{display:flex;justify-content:space-between;background:#1f2937;padding:12px;border-radius:12px;margin:8px 0}
.input{width:100%;padding:12px;background:#1f2937;border:0;color:#fff;border-radius:10px;margin:5px 0}
</style>
</head>
<body>
<div class="app">

<div id="home" class="page active">
<div class="header">🔥 الرافدين 🔥</div>
<div class="card">
<h3 style="text-align:center">رصيدك</h3>
<div class="points" id="points">1000</div>
<p style="text-align:center;color:#00e5ff" id="rate">العداد: 100</p>
<p style="text-align:center;color:#facc15" id="timer">23:59:59</p>
<button class="btn" onclick="collect()">💰 اجمع النقاط</button>
</div>
</div>

<div id="games" class="page">
<div class="card">
<h3>🎮 الالعاب</h3>
<button class="btn" onclick="spin()">🎡 عجلة -50</button>
<button class="btn" onclick="xo()">❌⭕ XO -50</button>
<button class="btn" onclick="box()">📦 صندوق -500</button>
</div>
</div>

<div id="xo" class="page">
<div class="card">
<h3>XO</h3>
<div class="board" id="board"></div>
<button class="btn" onclick="openPage('games')">رجوع</button>
</div>
</div>

<div id="tasks" class="page">
<div class="card">
<h3>📋 المهام</h3>
<div id="tasks"></div>
<h3>💸 تحويل</h3>
<p>كودك: <b id="code" style="color:#22c55e"></b></p>
<input id="tcode" class="input" placeholder="كود الصديق">
<input id="tamount" type="number" class="input" placeholder="المبلغ">
<button class="btn" onclick="transfer()">تحويل</button>
</div>
</div>

<div id="shop" class="page">
<div class="card">
<h3>🛒 المتجر</h3>
<div id="shop"></div>
</div>
</div>

</div>

<div class="nav">
<button onclick="openPage('home')" id="btn-home" class="active">🏠<br>العداد</button>
<button onclick="openPage('games')" id="btn-games">🎮<br>العاب</button>
<button onclick="openPage('tasks')" id="btn-tasks">📋<br>مهام</button>
<button onclick="openPage('shop')" id="btn-shop">🛒<br>متجر</button>
</div>

<script>
let points = parseInt(localStorage.getItem('p')) || 1000;
let rate = parseInt(localStorage.getItem('r')) || 100;
let last = parseInt(localStorage.getItem('l')) || 0;
let myCode = localStorage.getItem('code') || 'RAF'+Math.floor(Math.random()*9000);
localStorage.setItem('code',myCode);
let board = ['','',''];

function save(){
localStorage.setItem('p',points);
localStorage.setItem('r',rate);
localStorage.setItem('l',last);
}

function openPage(id){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
document.getElementById('btn-'+id).classList.add('active');
update();
}

function update(){
document.getElementById('points').innerText = points;
document.getElementById('rate').innerText = 'العداد: ' + rate;
document.getElementById('code').innerText = myCode;

let left = 86400000 - (Date.now() - last);
if(left<0) left=0;
let s = Math.floor(left/1000);
document.getElementById('timer').innerText = Math.floor(s/3600)+':'+Math.floor(s%3600/60)+':'+s%60;

let t = '';
[{txt:"اجمع 5 مرات",n:5},{txt:"العب XO",n:1},{txt:"افتح صندوق",n:1},{txt:"اشتري عداد",n:1}].forEach((x,i)=>{
t += `<div class="item"><span>${x.txt}</span><button class="btn" style="width:80px" onclick="claim(${i})">0/${x.n}</button></div>`;
});
document.getElementById('tasks').innerHTML = t;

let shtml = '';
[[100,1000],[200,2000],[300,3000],[400,4000],[500,5000],[1000,10000],[2000,20000],[3000,30000],[4000,40000],[5000,50000]].forEach(x=>{
shtml += `<div class="item"><span>+${x[0]} للعداد</span><button class="btn" style="width:100px" onclick="buy(${x[0]},${x[1]})">${x[1]}</button></div>`;
});
document.getElementById('shop').innerHTML = shtml;
}

function collect(){
if(Date.now()-last < 86400000) return alert('انتظر');
points += rate;
last = Date.now();
save(); update();
}

function buy(r,p){
if(points<p) return alert('ماعندك نقاط');
points -= p;
rate += r;
save(); update();
alert('تم شراء +' + r);
}

function spin(){
if(points<50) return alert('تحتاج 50');
points -= 50;
points += 200;
save(); update();
alert('ربحت 200');
}

function xo(){
if(points<50) return alert('تحتاج 50');
points -= 50; save(); update();
board = ['','',''];
let html = '';
for(let i=0;i<9;i++) html += `<div class="cell" onclick="play(${i})"></div>`;
document.getElementById('board').innerHTML = html;
openPage('xo');
}

function play(i){
if(board[i]) return;
board[i]='X';
document.getElementById('board').children[i].innerText='X';
points += 500; save(); update();
alert('فزت +500');
}

function box(){
if(points<500) return alert('تحتاج 500');
points -= 500;
points += 1000;
save(); update();
alert('ربحت 1000');
}

function transfer(){
let c = document.getElementById('tcode').value;
let a = parseInt(document.getElementById('tamount').value);
if(!c ||!a) return alert('دخل البيانات');
if(a>points) return alert('ماعندك');
points -= a;
save(); update();
alert('تم التحويل');
}

function claim(i){
alert('مهمة');
}

setInterval(update,1000);
update();
</script>
</body>
</html>
