<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرافدين</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Tahoma}
.app{max-width:430px;margin:auto;background:linear-gradient(180deg,#0d1b4d,#000);min-height:100vh;padding-bottom:75px}
.header{text-align:center;padding:15px;color:#00e5ff;font-size:24px;text-shadow:0 0 10px #00e5ff}
.card{background:#111827;margin:12px;padding:20px;border-radius:20px;border:1px solid #1e3a8a}
.points{font-size:50px;color:#22c55e;text-align:center;font-weight:bold}
.rate{font-size:16px;color:#00e5ff;text-align:center;margin:5px 0}
.timer{font-size:22px;color:#facc15;text-align:center;margin:8px 0}
.btn{background:linear-gradient(90deg,#2563eb,#06b6d4);color:#fff;border:0;padding:15px;width:100%;border-radius:14px;margin:8px 0;font-size:16px;font-weight:bold;cursor:pointer}
.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#0a0f1e;display:flex;border-top:1px solid #1e3a8a}
.nav button{flex:1;padding:10px;background:none;border:0;color:#aaa;font-size:11px;cursor:pointer}
.nav button.active{color:#00e5ff}
.page{display:none}.page.active{display:block}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:280px;margin:15px auto}
.cell{background:#1f2937;height:90px;font-size:45px;display:flex;align-items:center;justify-content:center;border-radius:15px;cursor:pointer}
.item{display:flex;justify-content:space-between;background:#1f2937;padding:14px;border-radius:14px;margin:10px 0}
.input{width:100%;padding:12px;background:#1f2937;border:0;color:#fff;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<div class="app">

<div id="home" class="page active">
<div class="header">🔥 الرافدين 🔥</div>
<div class="card">
<h3 style="text-align:center">رصيدك الحالي</h3>
<div class="points" id="points">1000</div>
<div class="rate" id="rate">عدادك: 100 نقطة / 24 ساعة</div>
<div class="timer" id="timer">23:59:59</div>
<button class="btn" onclick="collect()">💰 اجمع النقاط</button>
</div>
</div>

<div id="games" class="page">
<div class="card">
<h3 style="text-align:center">🎮 الالعاب</h3>
<button class="btn" onclick="spin()">🎡 لف العجلة -50</button>
<button class="btn" onclick="xo()">❌⭕ لعبة XO -50</button>
<button class="btn" onclick="box()">📦 صندوق -500</button>
</div>
</div>

<div id="xo" class="page">
<div class="card">
<h3 style="text-align:center">XO ضد البوت</h3>
<div class="board" id="board"></div>
<button class="btn" onclick="go('games')">رجوع</button>
</div>
</div>

<div id="tasks" class="page">
<div class="card">
<h3 style="text-align:center">📋 المهام</h3>
<div id="tasks"></div>
<h3 style="text-align:center">💸 تحويل نقاط</h3>
<p style="text-align:center">كودك: <b id="code" style="color:#22c55e"></b></p>
<input id="tcode" class="input" placeholder="كود الصديق">
<input id="tamount" type="number" class="input" placeholder="المبلغ">
<button class="btn" onclick="transfer()">تحويل</button>
</div>
</div>

<div id="shop" class="page">
<div class="card">
<h3 style="text-align:center">🛒 المتجر</h3>
<div id="shop"></div>
</div>
</div>

</div>

<div class="nav">
<button onclick="go('home')" class="active">🏠<br>العداد</button>
<button onclick="go('games')">🎮<br>العاب</button>
<button onclick="go('tasks')">📋<br>مهام</button>
<button onclick="go('shop')">🛒<br>متجر</button>
</div>

<script>
let points = localStorage.p?parseInt(localStorage.p):1000;
let rate = localStorage.r?parseInt(localStorage.r):100;
let last = localStorage.l?parseInt(localStorage.l):0;
let code = localStorage.code || 'RAF'+Math.floor(Math.random()*9000);
localStorage.code = code;

function save(){localStorage.p=points; localStorage.r=rate; localStorage.l=last;}

function go(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.getElementById(p).classList.add('active');
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
event.currentTarget.classList.add('active');
update();
}

function update(){
document.getElementById('points').innerText = points;
document.getElementById('rate').innerText = 'عدادك: ' + rate + ' نقطة / 24 ساعة';
document.getElementById('code').innerText = code;

let left = 86400000 - (Date.now() - last);
if(left<0) left=0;
let h = Math.floor(left/3600000);
let m = Math.floor((left%3600000)/60000);
let s = Math.floor((left%60000)/1000);
document.getElementById('timer').innerText = h+':'+m+':'+s;

let t='';
t+=`<div class="item"><span>اجمع 5 مرات</span><button class="btn" style="width:90px">0/5</button></div>`;
t+=`<div class="item"><span>العب XO</span><button class="btn" style="width:90px">0/1</button></div>`;
t+=`<div class="item"><span>افتح صندوق</span><button class="btn" style="width:90px">0/1</button></div>`;
t+=`<div class="item"><span>اشتري عداد</span><button class="btn" style="width:90px">0/1</button></div>`;
document.getElementById('tasks').innerHTML=t;

let s='';
s+=`<div class="item"><span>+100 للعداد</span><button class="btn" style="width:100px" onclick="buy(100,1000)">1000</button></div>`;
s+=`<div class="item"><span>+200 للعداد</span><button class="btn" style="width:100px" onclick="buy(200,2000)">2000</button></div>`;
s+=`<div class="item"><span>+300 للعداد</span><button class="btn" style="width:100px" onclick="buy(300,3000)">3000</button></div>`;
s+=`<div class="item"><span>+400 للعداد</span><button class="btn" style="width:100px" onclick="buy(400,4000)">4000</button></div>`;
s+=`<div class="item"><span>+500 للعداد</span><button class="btn" style="width:100px" onclick="buy(500,5000)">5000</button></div>`;
s+=`<div class="item"><span>+1000 للعداد</span><button class="btn" style="width:100px" onclick="buy(1000,10000)">10000</button></div>`;
s+=`<div class="item"><span>+2000 للعداد</span><button class="btn" style="width:100px" onclick="buy(2000,20000)">20000</button></div>`;
s+=`<div class="item"><span>+3000 للعداد</span><button class="btn" style="width:100px" onclick="buy(3000,30000)">30000</button></div>`;
s+=`<div class="item"><span>+4000 للعداد</span><button class="btn" style="width:100px" onclick="buy(4000,40000)">40000</button></div>`;
s+=`<div class="item"><span>+5000 للعداد</span><button class="btn" style="width:100px" onclick="buy(5000,50000)">50000</button></div>`;
document.getElementById('shop').innerHTML=s;
}

function collect(){
if(Date.now()-last < 86400000) return alert('انتظر');
points += rate;
last = Date.now();
save(); update();
}

function buy(r,p){
if(points<p) return alert('ماعندك نقاط');
points -= p;
rate += r;
save(); update();
alert('تم شراء +' + r);
}

function spin(){
if(points<50) return alert('تحتاج 50');
points -= 50;
points += 200;
save(); update();
alert('ربحت 200');
}

function xo(){
if(points<50) return alert('تحتاج 50');
points -= 50; save(); update();
let html='';
for(let i=0;i<9;i++) html+=`<div class="cell" onclick="this.innerText='X';points+=500;save();update()">`+`</div>`;
document.getElementById('board').innerHTML=html;
go('xo');
}

function box(){
if(points<500) return alert('تحتاج 500');
points -= 500;
points += 1000;
save(); update();
alert('ربحت 1000');
}

function transfer(){
let c = document.getElementById('tcode').value;
let a = parseInt(document.getElementById('tamount').value);
if(!c ||!a) return alert('دخل البيانات');
if(a>points) return alert('ماعندك');
points -= a;
save(); update();
alert('تم التحويل');
}

setInterval(update,1000);
update();
</script>
</body>
</html>
