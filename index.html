<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الرافدين</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:white;font-family:'Tahoma';overflow-x:hidden}
.app{max-width:430px;margin:0 auto;background:linear-gradient(180deg,#0d1b4d,#000);min-height:100vh;padding-bottom:75px}
.header{text-align:center;padding:15px 0}
.header h1{font-size:24px;color:#00e5ff;text-shadow:0 0 10px #00e5ff}
.card{background:#111827;margin:12px;border-radius:20px;padding:20px;border:1px solid #1e3a8a}
.points{font-size:50px;color:#22c55e;text-align:center;font-weight:bold}
.rate{font-size:16px;color:#00e5ff;text-align:center;margin:5px 0;font-weight:bold}
.timer{font-size:22px;color:#facc15;text-align:center;margin:8px 0}
.btn{background:linear-gradient(90deg,#2563eb,#06b6d4);color:white;border:0;padding:15px;border-radius:14px;width:100%;font-size:16px;font-weight:bold;margin:8px 0;cursor:pointer}
.btn:active{transform:scale(0.96)}
.btn:disabled{background:#333;color:#777;box-shadow:none}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:auto;background:#0a0f1e;display:flex;border-top:1px solid #1e3a8a}
.nav button{flex:1;background:none;border:0;color:#aaa;padding:10px 0;font-size:11px}
.nav button.active{color:#00e5ff}
.page{display:none}.page.active{display:block}
.item{background:#1f2937;padding:14px;border-radius:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.item button{width:110px;padding:10px;font-size:14px}
.wheel-wrap{display:flex;justify-content:center;margin:15px 0}
.wheel{width:250px;height:250px;border-radius:50%;border:8px solid #facc15;background:conic-gradient(#ef4444 0 60deg,#22c55e 60deg 120deg,#3b82f6 120deg 180deg,#eab308 180deg 240deg,#a855f7 240deg 300deg,#06b6d4 300deg 360deg);position:relative;transition:5s cubic-bezier(0.23,1,0.32,1)}
.pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:20px solid #fff;z-index:10}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:280px;margin:15px auto}
.cell{background:#1f2937;height:90px;border-radius:15px;font-size:45px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.event{background:linear-gradient(90deg,#facc15,#eab308);color:#000;text-align:center;padding:10px;border-radius:12px;font-weight:bold}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ef4444;color:white;padding:14px 22px;border-radius:12px;font-weight:bold;display:none;z-index:999;box-shadow:0 0 20px #ef4444}
</style>
</head>
<body>
<div class="toast" id="toast">نقاطك غير كافية ❌</div>
<div class="app">

<div id="home" class="page active">
<div class="header"><h1>🔥 الرافدين 🔥</h1></div>
<div class="card">
<div id="event"></div>
<h3 style="text-align:center">رصيدك الحالي</h3>
<div class="points" id="points">1,000</div>
<div class="rate" id="rateInfo">عدادك: 100 نقطة / 24 ساعة</div>
<div class="timer" id="timer">23:59:59</div>
<button class="btn" id="collectBtn" onclick="collect()">💰 اجمع 100 نقطة</button>
</div>
</div>

<div id="games" class="page">
<div class="card">
<h3 style="text-align:center">🎮 الالعاب</h3>
<div class="wheel-wrap">
<div style="position:relative">
<div class="pointer"></div>
<div class="wheel" id="wheel"></div>
</div>
</div>
<button class="btn" onclick="spin()">🎡 لف العجلة -50</button>
<button class="btn" onclick="startXO()">❌⭕ لعبة XO -50</button>
<button class="btn" onclick="box()">📦 صندوق -500</button>
</div>
</div>

<div id="xo" class="page">
<div class="card">
<h3 style="text-align:center">XO ضد البوت</h3>
<div class="board" id="board"></div>
<p id="xoText" style="text-align:center;color:#facc15">دورك</p>
<button class="btn" onclick="show('games')">رجوع</button>
</div>
</div>

<div id="tasks" class="page">
<div class="card">
<h3 style="text-align:center">📋 المهام <span id="taskTimer" style="color:#facc15;font-size:12px"></span></h3>
<div id="taskList"></div>
<h3 style="text-align:center;margin-top:15px">🤝 الاحالة</h3>
<input id="refInput" placeholder="كود صديقك" style="padding:12px;border-radius:10px;border:0;width:60%">
<button class="btn" onclick="useRef()" style="width:35%">تفعيل</button>
<p style="text-align:center">كودك: <b id="myCode" style="color:#22c55e"></b></p>
</div>
</div>

<div id="shop" class="page">
<div class="card">
<h3 style="text-align:center">🛒 المتجر</h3>
<div id="shopList"></div>
</div>
</div>

<div id="board" class="page">
<div class="card">
<h3 style="text-align:center">🏆 المتصدرين</h3>
<div id="leader"></div>
</div>
</div>

</div>

<div class="nav">
<button onclick="show('home')" class="active">🏠<br>العداد</button>
<button onclick="show('games')">🎮<br>العاب</button>
<button onclick="show('tasks')">📋<br>مهام</button>
<button onclick="show('shop')">🛒<br>متجر</button>
<button onclick="show('board')">🏆<br>متصدرين</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('rafidainMobile')) || {
points:1000, rate:100, last:0, myCode:'RAF'+Math.floor(Math.random()*9000),
usedRef:false, tasks:[], taskEnd:0
};

let allTasks100 = [];
for(let i=1;i<=100;i++) allTasks100.push({text:`اجمع ${Math.floor(Math.random()*7)+3} مرات`,type:"collect",need:Math.floor(Math.random()*7)+3,reward:Math.floor(Math.random()*1200)+500});
allTasks100.push({text:"العب XO",type:"game",need:1,reward:500});
allTasks100.push({text:"افتح صندوق",type:"box",need:1,reward:800});
allTasks100.push({text:"اشتري عداد",type:"buy",need:1,reward:2000});

let boardXO = Array(9).fill('');
let gameOver = false;

function save(){localStorage.setItem('rafidainMobile', JSON.stringify(data));}

function showToast(msg, color='#ef4444'){
let t = document.getElementById('toast');
t.innerText = msg;
t.style.background = color;
t.style.display = 'block';
setTimeout(()=>t.style.display='none',2000);
}

function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function update(){
document.getElementById('points').innerText = data.points.toLocaleString();
document.getElementById('rateInfo').innerText = `عدادك: ${data.rate} نقطة / 24 ساعة`;
document.getElementById('myCode').innerText = data.myCode;
document.getElementById('event').innerHTML = new Date().getDay()==5? '<div class="event">🎉 الجمعة: الجمع ×2 🎉</div>' : '';
let mult = new Date().getDay()==5? 2:1;

let left = 86400000 - (Date.now() - data.last); if(left<0) left=0;
let h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);
document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
document.getElementById('collectBtn').disabled = left>0;
document.getElementById('collectBtn').innerText = left<=0? `💰 اجمع ${data.rate*mult} نقطة` : '⏳ انتظر';

if(Date.now() > data.taskEnd || data.tasks.length==0){
data.tasks = allTasks100.sort(()=>0.5-Math.random()).slice(0,3).map(t=>({...t,prog:0,done:false}));
data.taskEnd = Date.now() + 86400000;
}
let tLeft = data.taskEnd - Date.now();
document.getElementById('taskTimer').innerText = `تتجدد بعد ${Math.floor(tLeft/3600000)}س`;

let tHtml='';
data.tasks.forEach((t,i)=>{tHtml+=`<div class="item"><div><b>${t.text}</b><br><small>+${t.reward}</small></div><button class="btn" onclick="claim(${i})" ${t.prog<t.need?'disabled':''}>${t.done?'✅':t.prog+'/'+t.need}</button></div>`;});
document.getElementById('taskList').innerHTML=tHtml;

let shop='';
let prices = [
{rate:100,price:1000},{rate:200,price:2000},{rate:300,price:3000},{rate:400,price:4000},{rate:500,price:5000},
{rate:1000,price:10000},{rate:2000,price:20000},{rate:3000,price:30000},{rate:4000,price:40000},{rate:5000,price:50000}
];
prices.forEach(p=>{
let canBuy = data.points >= p.price;
shop+=`<div class="item"><span><b>عداد ${p.rate}</b></span><button class="btn" onclick="buy(${p.rate},${p.price})" ${!canBuy?'disabled':''}>${p.price.toLocaleString()}</button></div>`;
});
document.getElementById('shopList').innerHTML=shop;

let top=[{n:'انت',p:data.points},{n:'احمد',p:125000},{n:'علي',p:98000}].sort((a,b)=>b.p-a.p);
document.getElementById('leader').innerHTML = top.map((x,i)=>`<div class="item"><span>🥇 #${i+1} ${x.n}</span><b>${x.p.toLocaleString()}</b></div>`).join('');
}

function collect(){
if(Date.now()-data.last<86400000) return;
let mult = new Date().getDay()==5? 2:1;
data.points += data.rate*mult; data.last = Date.now();
data.tasks.forEach(t=>{if(t.type=="collect") t.prog++;});
save(); update();
}

function buy(r,p){
if(data.points<p){
showToast('نقاطك غير كافية ❌');
return;
}
data.points-=p; data.rate=r; data.tasks.forEach(t=>{if(t.type=="buy") t.prog++;});
showToast('تم الشراء بنجاح ✅','#22c55e'); save(); update();
}

function spin(){
if(data.points<50){showToast('تحتاج 50 نقطة'); return;}
data.points-=50;
let prizes=[50,100,200,500,1000,2000];
let win = prizes[Math.floor(Math.random()*prizes.length)];
let deg = 1800 + Math.floor(Math.random()*360);
document.getElementById('wheel').style.transform=`rotate(${deg}deg)`;
data.tasks.forEach(t=>{if(t.type=="game") t.prog++;});
setTimeout(()=>{
data.points+=win;
showToast('ربحت '+win,'#22c55e'); save(); update();
},5000); update();
}

function startXO(){
if(data.points<50){showToast('تحتاج 50 نقطة'); return;}
data.points-=50; save(); update();
boardXO=Array(9).fill(''); gameOver=false;
renderXO(); show('xo');
}
function renderXO(){
let h=''; for(let i=0;i<9;i++) h+=`<div class="cell" onclick="playXO(${i})">${boardXO[i]}</div>`;
document.getElementById('board').innerHTML=h;
}

function bestMove(b){
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
// 1. يشوف اذا يكدر يفوز
for(let c of wins){
let line = c.map(i=>b[i]);
if(line.filter(x=>x=='O').length==2 && line.includes('')) return c[line.indexOf('')];
}
// 2. يسد عليك اذا راح تفوز
for(let c of wins){
let line = c.map(i=>b[i]);
if(line.filter(x=>x=='X').length==2 && line.includes('')) return c[line.indexOf('')];
}
// 3. ياخذ الوسط
if(b[4]=='') return 4;
// 4. ياخذ الزوايا
let corners=[0,2,6,8].filter(i=>b[i]=='');
if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
// 5. اي مكان فاضي
let empty=b.map((v,i)=>v?'':i).filter(x=>x!=='');
return empty[Math.floor(Math.random()*empty.length)];
}

function playXO(i){
if(boardXO[i]||gameOver) return;
boardXO[i]='X'; renderXO();
if(checkWin('X')){gameOver=true; document.getElementById('xoText').innerText='فزت!'; data.points+=1000; save(); update(); return;}
if(!boardXO.includes('')){gameOver=true; document.getElementById('xoText').innerText='تعادل'; return;}
document.getElementById('xoText').innerText='دور البوت';
setTimeout(()=>{
let move = bestMove(boardXO);
boardXO[move]='O'; renderXO();
if(checkWin('O')){gameOver=true; document.getElementById('xoText').innerText='خسرت'; return;}
if(!boardXO.includes('')){gameOver=true; document.getElementById('xoText').innerText='تعادل'; return;}
document.getElementById('xoText').innerText='دورك';
},500);
}
function checkWin(p){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return wins.some(c=>c.every(i=>boardXO[i]===p));}

function box(){
if(data.points<500){showToast('تحتاج 500 نقطة'); return;}
data.points-=500; let win=[100,500,1000,2000,5000][Math.floor(Math.random()*5)];
data.points+=win; data.tasks.forEach(t=>{if(t.type=="box") t.prog++;});
showToast('ربحت '+win,'#22c55e'); save(); update();
}

function claim(i){
if(data.tasks[i].prog>=data.tasks[i].need &&!data.tasks[i].done){
data.points += data.tasks[i].reward; data.tasks[i].done=true;
save(); update();
}
}

function useRef(){
let code = document.getElementById('refInput').value;
if(code &&!data.usedRef && code!=data.myCode){
data.points+=5000; data.usedRef=true; save(); update();
showToast('تم +5000','#22c55e');
}else showToast('كود غلط');
}

setInterval(update,1000); update();
</script>
</body>
</html>
