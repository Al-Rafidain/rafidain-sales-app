<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الرافدين</title>
<style>
body{background:#000;color:#fff;font-family:Tahoma;text-align:center;margin:0;padding:10px}
.card{background:#111827;margin:10px auto;padding:20px;border-radius:15px;max-width:400px}
.btn{background:#2563eb;color:#fff;border:0;padding:15px;width:90%;border-radius:12px;margin:8px;font-size:16px}
.points{font-size:50px;color:#22c55e}
</style>
</head>
<body>

<div class="card">
<h2 style="color:#00e5ff">🔥 الرافدين 🔥</h2>
<h3>رصيدك</h3>
<div class="points" id="points">1000</div>
<p id="timer">الوقت: 24:00:00</p>
<button class="btn" onclick="collect()">اجمع 100</button>
</div>

<div class="card">
<h3>الالعاب</h3>
<button class="btn" onclick="spin()">عجلة -50</button>
<button class="btn" onclick="xo()">XO -50</button>
<button class="btn" onclick="box()">صندوق -500</button>
</div>

<div class="card">
<h3>المتجر</h3>
<button class="btn" onclick="buy(100,1000)">+100 عداد = 1000</button>
<button class="btn" onclick="buy(500,5000)">+500 عداد = 5000</button>
<button class="btn" onclick="buy(1000,10000)">+1000 عداد = 10000</button>
</div>

<script>
let points = 1000;
let rate = 100;
let last = Date.now();

function update(){
document.getElementById('points').innerText = points;
let left = 86400 - Math.floor((Date.now()-last)/1000);
if(left<0) left=0;
let h = Math.floor(left/3600);
let m = Math.floor((left%3600)/60);
let s = left%60;
document.getElementById('timer').innerText = `الوقت: ${h}:${m}:${s}`;
}

function collect(){
if(Date.now()-last < 86400000) return alert('انتظر للغد');
points += rate;
last = Date.now();
update();
}

function buy(r,p){
if(points<p) return alert('ماعندك نقاط');
points -= p;
rate += r;
alert('تم شراء +' + r);
update();
}

function spin(){
if(points<50) return alert('تحتاج 50');
points -= 50;
points += 200;
alert('ربحت 200');
update();
}

function xo(){
if(points<50) return alert('تحتاج 50');
points -= 50;
points += 500;
alert('فزت +500');
update();
}

function box(){
if(points<500) return alert('تحتاج 500');
points -= 500;
points += 1000;
alert('ربحت 1000');
update();
}

setInterval(update,1000);
update();
</script>
</body>
</html>
