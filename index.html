<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرافدين</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body {font-family: 'Tahoma'; background: linear-gradient(135deg, #0a1a3a 0%, #0066ff 100%); color: white; padding-bottom: 80px;}
.container {max-width: 500px; margin: auto; padding: 15px;}
h1 {color: #00ccff; text-align: center; margin: 10px 0; font-size: 30px;}
.card {background: rgba(0,0,0,0.35); padding: 20px; border-radius: 20px; margin: 15px 0;}
.points {font-size: 36px; color: #00ff88; font-weight: bold; text-align: center; margin: 10px 0;}
.circle-timer {width: 200px; height: 200px; margin: 15px auto; position: relative;}
svg {transform: rotate(-90deg);}
.circle-bg {fill: none; stroke: #333; stroke-width: 12;}
.circle-progress {fill: none; stroke: #00ff88; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s linear;}
.timer-text {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #ffcc00; font-weight: bold;}
button {background: #0066ff; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 6px 0; width: 100%; font-weight: bold;}
button:disabled {background: #555; color: #aaa;}
.shop-item,.task-item {background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; text-align: right;}
.task-item button {width: 80px; padding: 8px;}
.input {width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 10px 0; background: #222; color: white; text-align: center;}
.wheel {width: 240px; height: 240px; border-radius: 50%; margin: 15px auto; border: 8px solid #ffcc00; display: flex; align-items: center; justify-content: center; font-size: 18px; background: conic-gradient(#0066ff 0deg 60deg, #00ff88 60deg 120deg, #ff0066 120deg 180deg, #ffcc00 180deg 240deg, #9900ff 240deg 300deg, #00ccff 300deg 360deg); transition: transform 4s cubic-bezier(.17,.67,.83,.67);}
.board {display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 260px; height: 260px; margin: 15px auto;}
.cell {background: rgba(255,255,255,0.15); border-radius: 12px; font-size: 45px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer;}
.nav {position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a3a; display: flex; justify-content: space-around; padding: 8px 0; border-top: 2px solid #0066ff;}
.nav button {background: none; font-size: 11px; padding: 5px; width: auto;}
.nav button.active {color: #00ccff;}
.page {display: none;}
.page.active {display: block;}
.fly {position: fixed; font-size: 24px; color: #00ff88; animation: fly 1s forwards; pointer-events: none;}
@keyframes fly {0%{opacity:1; transform:translateY(0)} 100%{opacity:0; transform:translateY(-100px)}}
</style>
</head>
<body>
<div class="container">
    <h1>الرافدين</h1>

    <div id="page-home" class="page active">
        <div class="card">
            <h2 style="text-align:center">رصيدك</h2>
            <div class="points" id="points">1000</div>
            <div class="circle-timer">
                <svg width="200" height="200">
                    <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="circle-progress" id="progress" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
                </svg>
                <div class="timer-text" id="timer">00:00:00</div>
            </div>
            <button id="collectBtn" onclick="collect()">اجمع النقاط</button>
        </div>
    </div>

    <div id="page-wheel" class="page">
        <div class="card">
            <h2 style="text-align:center">العاب</h2>
            <p style="text-align:center; color:#ffcc00">كل لعبة = 50 نقطة</p>
            <div class="wheel" id="wheel">لف</div>
            <button id="spinBtn" onclick="spinWheel()">عجلة الحظ - 50 نقطة</button>
            <button id="xoBtn" onclick="startXO()">لعبة XO - 50 نقطة</button>
        </div>
    </div>

    <div id="page-tasks" class="page">
        <div class="card">
            <h2 style="text-align:center">المهام اليومية</h2>
            <p style="text-align:center; font-size:12px; color:#aaa">تتجدد كل 24 ساعة</p>
            <div id="tasks"></div>
        </div>
    </div>

    <div id="page-shop" class="page">
        <div class="card">
            <h2 style="text-align:center">متجر العدادات</h2>
            <div id="shop"></div>
        </div>
    </div>

    <div id="page-withdraw" class="page">
        <div class="card">
            <h2 style="text-align:center">السحب</h2>
            <p style="text-align:center">اقل سحب: 100000 نقطة = 10$</p>
            <input type="text" id="withdrawInfo" class="input" placeholder="رقمك او الايميل">
            <button onclick="withdraw()">طلب سحب</button>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="card">
            <h2 style="text-align:center">البروفايل</h2>
            <div style="margin-top:15px">
                <label>رمز الاحالة الخاص بك:</label>
                <input type="text" id="refCode" class="input" readonly>
                <button onclick="copyRef()">نسخ الرمز</button>
                <p style="font-size:12px">تاخذ 10% من نقاط اي شخص يدخل برمزك</p>
            </div>
            <div style="margin-top:15px">
                <label>ادخل رمز احالة:</label>
                <input type="text" id="enterRef" class="input" placeholder="ادخل الرقم هنا">
                <button onclick="useRef()">تفعيل الرمز +500 نقطة</button>
            </div>
        </div>
    </div>

    <div id="page-xo" class="page">
        <div class="card">
            <h2 style="text-align:center">XO ضد البوت</h2>
            <div class="board" id="board"></div>
            <p id="xoStatus" style="text-align:center">دورك X</p>
            <button onclick="showPage('wheel')">رجوع</button>
        </div>
    </div>
</div>

<div class="nav">
    <button onclick="showPage('home')" id="nav-home" class="active">العداد</button>
    <button onclick="showPage('wheel')" id="nav-wheel">العاب</button>
    <button onclick="showPage('tasks')" id="nav-tasks">المهام</button>
    <button onclick="showPage('shop')" id="nav-shop">المتجر</button>
    <button onclick="showPage('withdraw')" id="nav-withdraw">السحب</button>
    <button onclick="showPage('profile')" id="nav-profile">البروفايل</button>
</div>

<script>
let userId = localStorage.getItem('userId') || Date.now();
localStorage.setItem('userId', userId);

let data = JSON.parse(localStorage.getItem('rafidain_'+userId)) || {
    points: 1000, lastCollect: 0, rate: 100, level: 1, refCode: userId,
    referredBy: null, dailyTasks: [], lastTaskReset: 0,
    stats: {collects: 0, spent: 0, spins: 0, xoGames: 0}
};

const shopItems = [
    {level: 1, rate: 100, price: 1000}, {level: 2, rate: 200, price: 2000},
    {level: 3, rate: 300, price: 3000}, {level: 4, rate: 400, price: 4000},
    {level: 5, rate: 500, price: 5000}, {level: 6, rate: 1000, price: 10000},
    {level: 7, rate: 2000, price: 20000}, {level: 8, rate: 3000, price: 30000},
    {level: 9, rate: 4000, price: 40000}, {level: 10, rate: 5000, price: 50000}
];
const wheelPrizes = [50, 100, 200, 500, 1000, 2000, 5000];
const allTasks = [
    {id: 'login', text: 'سجل دخول يومي', reward: 200},
    {id: 'collect3', text: 'اجمع النقاط 3 مرات', reward: 300},
    {id: 'spend1000', text: 'اصرف 1000 نقطة', reward: 250},
    {id: 'spin1', text: 'لف العجلة مرة', reward: 150},
    {id: 'playxo', text: 'العب XO مرة', reward: 200},
    {id: 'reach5k', text: 'اوصل 5000 نقطة', reward: 500},
];
const circumference = 2 * Math.PI * 90;
let board = Array(9).fill('');
let xoOver = false;

function save(){localStorage.setItem('rafidain_'+userId, JSON.stringify(data));}
function showPage(p){
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
    document.getElementById('page-'+p).classList.add('active');
    document.getElementById('nav-'+p).classList.add('active');
}
function fmt(ms){let s=Math.floor(ms/1000); let h=Math.floor(s/3600); let m=Math.floor((s%3600)/60); let sec=s%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function fly(){let d=document.createElement('div'); d.className='fly'; d.innerText='+'+data.rate; d.style.left=Math.random()*80+10+'%'; d.style.top='40%'; document.body.appendChild(d); setTimeout(()=>d.remove(),1000);}

function update(){
    document.getElementById('points').innerText = data.points.toLocaleString();
    document.getElementById('refCode').value = data.refCode;

    let left = 86400000 - (Date.now() - data.lastCollect);
    if(left<0) left=0;
    document.getElementById('timer').innerText = fmt(left);
    document.getElementById('progress').style.strokeDashoffset = circumference - ((1-left/86400000)*circumference);
    document.getElementById('collectBtn').disabled = left>0;
    document.getElementById('collectBtn').innerText = left<=0? `اجمع ${data.rate.toLocaleString()} نقطة` : "انتظر";

    document.getElementById('spinBtn').disabled = data.points<50;
    document.getElementById('xoBtn').disabled = data.points<50;

    if(Date.now()-data.lastTaskReset>86400000 ||!data.dailyTasks.length){
        data.dailyTasks = [...allTasks].sort(()=>0.5-Math.random()).slice(0,3).map(t=>({...t,done:0}));
        data.lastTaskReset=Date.now();
    }
    data.dailyTasks.forEach(t=>{
        if(!t.done){
            if(t.id==='collect3'&&data.stats.collects>=3)t.done=1;
            if(t.id==='spend1000'&&data.stats.spent>=1000)t.done=1;
            if(t.id==='spin1'&&data.stats.spins>=1)t.done=1;
            if(t.id==='playxo'&&data.stats.xoGames>=1)t.done=1;
            if(t.id==='reach5k'&&data.points>=5000)t.done=1;
        }
    });
    document.getElementById('tasks').innerHTML = data.dailyTasks.map(t=>`
        <div class="task-item"><span>${t.text}</span><button onclick="claim('${t.id}')" ${t.done?'disabled':''}>${t.done?'تم':'+t.reward}</button></div>`).join('');

    document.getElementById('shop').innerHTML = shopItems.map(i=>`
        <div class="shop-item"><div><b>عداد ${i.rate} نقطة</b><br>${i.price.toLocaleString()} نقطة</div>
        <button onclick="buy(${i.level})" ${data.points<i.price?'disabled':''}>شراء</button></div>`).join('');
}

function collect(){
    data.points+=data.rate; data.lastCollect=Date.now(); data.stats.collects++;
    save(); update(); fly();
}
function buy(l){
    let i=shopItems.find(x=>x.level===l);
    if(data.points>=i.price){data.points-=i.price; data.stats.spent+=i.price; data.rate=i.rate; data.level=l; save(); update(); alert('تم شراء عداد '+i.rate)}
}
function spinWheel(){
    if(data.points<50)return; data.points-=50; data.stats.spins++;
    let prize=wheelPrizes[Math.floor(Math.random()*7)];
    document.getElementById('wheel').style.transform=`rotate(${1800+Math.random()*360}deg)`;
    setTimeout(()=>{data.points+=prize; save(); update(); alert('ربحت '+prize.toLocaleString())},4000);
}
function startXO(){
    if(data.points<50)return; data.points-=50; data.stats.xoGames++; save(); update();
    board=Array(9).fill(''); xoOver=false; renderXO(); showPage('xo');
}
function renderXO(){document.getElementById('board').innerHTML=board.map((c,i)=>`<div class="cell" onclick="xo(${i})">${c}</div>`).join('')}
function xo(i){
    if(board[i]||xoOver)return; board[i]='X'; renderXO();
    if(win('X')){endXO('win');return;} if(!board.includes('')){endXO('draw');return;}
    setTimeout(()=>{let e=board.map((v,j)=>v?'':j).filter(x=>x!==''); board[e[Math.floor(Math.random()*e.length)]]='O'; renderXO(); if(win('O'))endXO('lose'); if(!board.includes(''))endXO('draw'); document.getElementById('xoStatus').innerText='دورك X'},500);
}
function win(p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(c=>c.every(i=>board[i]===p))}
function endXO(r){xoOver=true; let prize=[50,100,200,500,1000][Math.floor(Math.random()*5)];
    if(r==='win'){data.points+=prize; document.getElementById('xoStatus').innerText=`فزت! +${prize}`}
    else{document.getElementById('xoStatus').innerText=r==='draw'?'تعادل':'خسرت'} save(); update();}
function claim(id){let t=data.dailyTasks.find(x=>x.id===id); if(t&&!t.done){data.points+=t.reward; t.done=1; save(); update();}}
function withdraw(){if(data.points<100000){alert('تحتاج 100000');return;} if(!document.getElementById('withdrawInfo').value){alert('دخل معلومات');return;} alert('تم ارسال الطلب')}
function useRef(){let c=document.getElementById('enterRef').value; if(data.referredBy){alert('مفعل من قبل');return;} if(c){data.referredBy=c; data.points+=500; save(); update(); alert('تم +500 نقطة')}}
function copyRef(){navigator.clipboard.writeText(data.refCode); alert('تم النسخ')}

setInterval(update,1000); update();
</script>
</body>
</html>
