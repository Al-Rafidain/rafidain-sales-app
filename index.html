<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرافدين</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family: Tahoma; background: linear-gradient(135deg,#0a1a3a,#0066ff); color:white; padding-bottom:80px}
.container {max-width:500px;margin:auto;padding:15px}
h1 {text-align:center;color:#00ccff;margin:10px 0;font-size:28px}
.card {background:rgba(0,0,0,0.4);padding:20px;border-radius:20px;margin:15px 0}
.points {font-size:40px;color:#00ff88;text-align:center;font-weight:bold;margin:10px 0}
.circle {width:200px;height:200px;margin:15px auto;position:relative}
svg {transform:rotate(-90deg)}
.bg {fill:none;stroke:#333;stroke-width:12}
.prog {fill:none;stroke:#00ff88;stroke-width:12;stroke-linecap:round}
.time {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#ff0;font-weight:bold}
button {background:#0066ff;color:white;border:none;padding:15px;width:100%;border-radius:12px;font-size:16px;margin:5px 0;cursor:pointer;font-weight:bold}
button:disabled {background:#555;color:#aaa}
.shop div {background:rgba(255,255,255,0.1);padding:12px;margin:8px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center;text-align:right}
.shop button {width:80px;padding:8px}
.nav {position:fixed;bottom:0;left:0;right:0;background:#0a1a3a;display:flex;border-top:2px solid #06f}
.nav button {flex:1;background:none;font-size:12px;padding:10px;color:white;border:none}
.wheel {width:230px;height:230px;border-radius:50%;margin:15px auto;border:8px solid #ff0;background:conic-gradient(#06f 0 60deg,#0f8 60deg 120deg,#f06 120deg 180deg,#ff0 180deg 240deg,#90f 240deg 300deg,#0cf 300deg 360deg);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;transition:4s}
.board {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:260px;margin:15px auto}
.cell {background:rgba(255,255,255,0.15);height:80px;border-radius:12px;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold}
.page {display:none}.page.active{display:block}
</style>
</head>
<body>
<div class="container">
<h1>الرافدين</h1>

<div id="home" class="page active">
<div class="card">
<h2 style="text-align:center">رصيدك</h2>
<div class="points" id="points">1000</div>
<div class="circle">
<svg width="200" height="200">
<circle class="bg" cx="100" cy="100" r="90"></circle>
<circle class="prog" id="prog" cx="100" cy="100" r="90" stroke-dasharray="565" stroke-dashoffset="565"></circle>
</svg>
<div class="time" id="time">23:59:59</div>
</div>
<button id="collect" onclick="collect()">اجمع 100 نقطة</button>
</div>
</div>

<div id="games" class="page">
<div class="card">
<h2 style="text-align:center">العاب - 50 نقطة</h2>
<div class="wheel" id="wheel">لف</div>
<button id="spin" onclick="spin()">عجلة الحظ</button>
<button id="xo" onclick="startXO()">لعبة XO</button>
</div>
</div>

<div id="shop" class="page">
<div class="card">
<h2 style="text-align:center">متجر العدادات</h2>
<div id="shopList" class="shop"></div>
</div>
</div>

<div id="xoPage" class="page">
<div class="card">
<h2 style="text-align:center">XO ضد البوت</h2>
<div id="board" class="board"></div>
<p id="xoText" style="text-align:center;font-size:18px;color:#ff0">دورك X</p>
<button onclick="go('games')">رجوع</button>
</div>
</div>

</div>

<div class="nav">
<button onclick="go('home')">العداد</button>
<button onclick="go('games')">العاب</button>
<button onclick="go('shop')">متجر</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('rafidain')) || {points: 1000, rate: 100, lastCollect: 0};
let board = Array(9).fill('');
let circum = 2 * Math.PI * 90;
let gameOver = false;

function save(){localStorage.setItem('rafidain', JSON.stringify(data));}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); document.getElementById(p).classList.add('active');}

function update(){
document.getElementById('points').innerText = data.points.toLocaleString();
let left = 86400000 - (Date.now() - data.lastCollect);
if(left<0) left=0;
let h = Math.floor(left/3600000); let m = Math.floor((left%3600000)/60000); let s = Math.floor((left%60000)/1000);
document.getElementById('time').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
document.getElementById('prog').style.strokeDashoffset = circum - ((1-left/86400000)*circum);
document.getElementById('collect').disabled = left>0;
document.getElementById('collect').innerText = left<=0? `اجمع ${data.rate} نقطة` : 'انتظر';
document.getElementById('spin').disabled = data.points<50;
document.getElementById('xo').disabled = data.points<50;

let shop='';
// هنا التعديل مال الاسعار
let prices = [
{rate:100, price:1000},
{rate:200, price:2000},
{rate:300, price:3000},
{rate:400, price:4000},
{rate:500, price:5000},
{rate:1000, price:10000},
{rate:2000, price:20000},
{rate:3000, price:30000},
{rate:4000, price:40000},
{rate:5000, price:50000}
];
prices.forEach(item=>{
shop+=`<div><div><b>عداد ${item.rate} نقطة</b><br>${item.price.toLocaleString()} نقطة</div><button onclick="buy(${item.rate},${item.price})" ${data.points<item.price?'disabled':''}>شراء</button></div>`
});
document.getElementById('shopList').innerHTML=shop;
}

function collect(){data.points+=data.rate; data.lastCollect=Date.now(); save(); update();}
function buy(r,p){if(data.points>=p){data.points-=p; data.rate=r; save(); update(); alert('تم شراء عداد '+r+' نقطة')}}
function spin(){if(data.points<50)return; data.points-=50; save(); let prize=[50,100,200,500,1000][Math.floor(Math.random()*5)]; document.getElementById('wheel').style.transform=`rotate(${1800+Math.random()*360}deg)`; setTimeout(()=>{data.points+=prize; save(); update(); alert('ربحت '+prize.toLocaleString()+' نقطة')},4000); update();}
function startXO(){if(data.points<50)return; data.points-=50; save(); update(); board=Array(9).fill(''); gameOver=false; renderXO(); document.getElementById('xoText').innerText='دورك X'; go('xoPage');}
function renderXO(){let h=''; for(let i=0;i<9;i++) h+=`<div class="cell" onclick="play(${i})">${board[i]}</div>`; document.getElementById('board').innerHTML=h;}
function play(i){if(board[i] || gameOver) return; board[i]='X'; renderXO(); if(checkWin('X')){gameOver=true; document.getElementById('xoText').innerText='فزت! +1000 نقطة'; data.points+=1000; save(); update(); return;} if(!board.includes('')){gameOver=true; document.getElementById('xoText').innerText='تعادل'; return;} document.getElementById('xoText').innerText='دور البوت O'; setTimeout(()=>{let empty=board.map((v,j)=>v?'':j).filter(x=>x!==''); board[empty[Math.floor(Math.random()*empty.length)]]='O'; renderXO(); if(checkWin('O')){gameOver=true; document.getElementById('xoText').innerText='خسرت'; return;} if(!board.includes('')){gameOver=true; document.getElementById('xoText').innerText='تعادل'; return;} document.getElementById('xoText').innerText='دورك X';},500);}
function checkWin(p){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return wins.some(c=>c.every(i=>board[i]===p));}
setInterval(update,1000); update();
</script>
</body>
</html>
