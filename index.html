<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>تطبيق الرافدين - v2</title>
<style>
*{box-sizing:border-box}
body{background:#000;color:#fff;font-family:tahoma,sans-serif;text-align:center;padding:10px;margin:0;padding-bottom:100px}
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a1a3a 0%,#000 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.5s}
.logo{font-size:50px;margin:15px}h1{color:#3b82f6;text-shadow:0 0 15px #3b82f6;font-size:26px}
.page{display:none}.page.active{display:block}
.box{border:3px solid #3b82f6;border-radius:18px;padding:20px;margin:15px auto;background:#111;max-width:420px}
#coins{font-size:36px;color:#0f0;font-weight:bold}#dailyProfit{font-size:36px;color:#ffb300;font-weight:bold}
.btn{background:#3b82f6;color:#fff;border:0;padding:16px;border-radius:15px;font-size:16px;font-weight:bold;margin:10px auto;cursor:pointer;width:90%;max-width:380px;display:block}
.btn-green{background:#0f0;color:#000}.btn-yellow{background:#ffb300;color:#000}.btn-red{background:#f33}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000;overflow-y:auto}
.modal-content{background:#1a1a1a;margin:20px auto;padding:15px;width:95%;max-width:500px;border-radius:15px;border:2px solid #3b82f6}
.input{width:90%;padding:12px;margin:8px 0;border-radius:8px;background:#222;color:#fff;border:1px solid #3b82f6}
.chatBox{height:250px;overflow-y:auto;background:#0a0a0a;border:2px solid #3b82f6;border-radius:15px;padding:10px;text-align:right}
.chatMsg{margin:8px 0;padding:8px 12px;border-radius:10px;max-width:85%}
.chatMsg.me{background:#3b82f6;margin-right:auto;text-align:left}.chatMsg.other{background:#222;margin-left:auto}
.bottomNav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:95%;max-width:500px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);border-radius:25px;display:flex;justify-content:space-around;padding:10px 5px;z-index:999}
.navItem{display:flex;flex-direction:column;align-items:center;color:#ddd;font-size:10px;cursor:pointer;flex:1}
.navItem.active{color:#fff;font-weight:bold}
#xoBoard{display:grid;grid-template-columns:repeat(3,90px);gap:5px;margin:20px auto;width:280px}
.xoCell{width:90px;height:90px;background:#222;font-size:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;border:2px solid #3b82f6}
.dominoTile{width:40px;height:80px;background:#eee;color:#000;border:2px solid #333;border-radius:6px;display:inline-block;margin:2px;cursor:pointer}
.ludoBoard{width:300px;height:300px;background:#fff;margin:10px auto;border:3px solid #3b82f6}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0c0;color:#000;padding:15px 25px;border-radius:10px;display:none;z-index:2000}
</style>
</head>
<body>
<div id="splash"><div class="logo">🏛️</div><div style="color:#3b82f6;font-size:28px;font-weight:bold">AL-RAFIDAIN</div></div>
  <div id="registerPage">
  <div class="logo">🏛️</div><h1>تسجيل الدخول</h1>
  <div class="box">
    <input type="text" id="regName" class="input" placeholder="اسمك">
    <input type="password" id="regPass" class="input" placeholder="كلمة السر">
    <button class="btn btn-green" onclick="createAccount()">دخول / تسجيل</button>
  </div>
</div>

<div id="mainApp" style="display:none">
  <div class="logo">🏛️</div><h1>تطبيق الرافدين</h1>
  <div id="home" class="page active">
    <div class="box"><h3>💰 الرصيد</h3><div id="coins">0</div><div id="coinsDollar"></div></div>
    <div class="box"><h3>⚙️ عدادك</h3><div id="dailyProfit">0</div></div>
    <button class="btn btn-green" onclick="claimProfit()">استلام الارباح</button>
  </div>
    <div id="games" class="page">
    <h2>🎮 الالعاب</h2>
    <div class="box">رصيدك: <span id="coins3">0</span></div>
    <h3>فردي</h3>
    <button class="btn" onclick="openXO()">XO - 50</button>
    <button class="btn" onclick="spinWheel()">العجلة - 50</button>
    <button class="btn" onclick="openBox()">الصندوق - 500</button>
    <button class="btn" onclick="openMemory()">ميموري - 50</button>
    <h3>جماعي</h3>
    <button class="btn btn-yellow" onclick="openMultiplayerGame('domino')">دومينو جماعي</button>
    <button class="btn btn-yellow" onclick="openMultiplayerGame('ludo')">لودو جماعي</button>
  </div>

  <div id="rooms" class="page">
    <h2>🏠 الغرف</h2>
    <button class="btn btn-green" onclick="openCreateRoom()">انشاء غرفة - 80000</button>
    <div id="roomsList"></div>
  </div>

  <div id="chatRoom" class="page">
    <button class="btn" onclick="showPage('rooms',null)">🔙 رجوع</button>
    <h2 id="roomNameTitle"></h2>
    <div id="roomChatBox" class="chatBox"></div>
    <input type="text" id="roomChatInput" class="input" placeholder="اكتب">
    <button class="btn" onclick="sendRoomMsg()">ارسال</button>
  </div>
  <div id="xoModal" class="modal"><div class="modal-content"><h2>XO</h2><div id="xoBoard"></div><p id="xoResult"></p><button class="btn" onclick="closeModal('xoModal')">خروج</button></div></div>
<div id="wheelModal" class="modal"><div class="modal-content"><h2>العجلة</h2><button class="btn" onclick="doSpin()">لف - 50</button><p id="wheelResult"></p><button class="btn" onclick="closeModal('wheelModal')">اغلاق</button></div></div>
<div id="boxModal" class="modal"><div class="modal-content"><h2>الصندوق</h2><button class="btn" onclick="openBox()">افتح - 500</button><p id="boxResult"></p><button class="btn" onclick="closeModal('boxModal')">اغلاق</button></div></div>
<div id="memoryModal" class="modal"><div class="modal-content"><h2>ميموري</h2><div id="memoryBoard"></div><button class="btn" onclick="closeModal('memoryModal')">خروج</button></div></div>
<div id="dominoMPModal" class="modal"><div class="modal-content"><h2>دومينو جماعي</h2><div id="dominoTable"></div><div id="myDominoTiles"></div><button class="btn" onclick="closeModal('dominoMPModal')">خروج</button></div></div>
<div id="ludoMPModal" class="modal"><div class="modal-content"><h2>لودو جماعي</h2><canvas id="ludoBoard" class="ludoBoard" width="300" height="300"></canvas><button class="btn" onclick="rollLudoDice()">ارمي النرد</button><button class="btn" onclick="closeModal('ludoMPModal')">خروج</button></div></div>
<div id="createRoomModal" class="modal"><div class="modal-content"><input id="newRoomName" class="input" placeholder="اسم الغرفة"><button class="btn btn-green" onclick="createRoom()">انشاء</button><button class="btn btn-red" onclick="closeModal('createRoomModal')">الغاء</button></div></div>
<div id="toast" class="toast"></div>
<div class="bottomNav">
  <div class="navItem active" onclick="showPage('home',this)"><div>العداد</div></div>
  <div class="navItem" onclick="showPage('games',this)"><div>الالعاب</div></div>
  <div class="navItem" onclick="showPage('rooms',this)"><div>الغرف</div></div>
</div></div>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, arrayUnion, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbkpcBPq8G2OpyKxaVqPO7Mkfla4X9hxU",
  authDomain: "rafidainapp.firebaseapp.com",
  projectId: "rafidainapp",
  appId: "1:512875147812:web:54f33bda3780db7a4a9eb1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let coins=5000,dailyProfitTotal=0,lastClaim=0,currentUser='',rooms=[],currentRoom=null;
const RATE=10000;
let unsubRoomChat=null;
setTimeout(()=>{document.getElementById('splash').style.opacity='0';checkLogin()},1500);

async function checkLogin(){
  currentUser=localStorage.getItem('rafidain_user');
  if(currentUser){await loadUserData();document.getElementById('registerPage').style.display='none';document.getElementById('mainApp').style.display='block';listenToRooms();}
  else{document.getElementById('registerPage').style.display='flex';}
}

async function createAccount(){
  let name=document.getElementById('regName').value.trim();
  let pass=document.getElementById('regPass').value.trim();
  if(!name||!pass)return alert("دخل البيانات");
  const userRef=doc(db,"users",name);
  const snap=await getDoc(userRef);
  if(!snap.exists()){await setDoc(userRef,{name,pass,coins:5000,dailyProfit:0,lastClaim:Date.now()})}
  currentUser=name;localStorage.setItem('rafidain_user',name);
  location.reload();
}
window.createAccount=createAccount;

async function loadUserData(){
  const snap=await getDoc(doc(db,"users",currentUser));
  if(snap.exists()){
    let d=snap.data();
    coins=d.coins||5000;dailyProfitTotal=d.dailyProfit||0;lastClaim=d.lastClaim||0;
    updateUI();
  }
    }
    function updateUI(){
  document.getElementById('coins').innerText=coins.toLocaleString();
  document.getElementById('coins3').innerText=coins.toLocaleString();
  document.getElementById('coinsDollar').innerText=`$${(coins/RATE).toFixed(2)}`;
  document.getElementById('dailyProfit').innerText=dailyProfitTotal.toLocaleString();
  if(currentUser)setDoc(doc(db,"users",currentUser),{coins,dailyProfit:dailyProfitTotal,lastClaim},{merge:true});
}

function showPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.navItem').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');if(el)el.classList.add('active');
}
window.showPage=showPage;
window.closeModal=(id)=>document.getElementById(id).style.display='none';

window.claimProfit=()=>{
  let now=Date.now();
  if(now-lastClaim>24*60*60*1000 && dailyProfitTotal>0){
    coins+=dailyProfitTotal;lastClaim=now;updateUI();showToast(`+${dailyProfitTotal}`);
  }
}
function showToast(msg){let t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
    function listenToRooms(){
  onSnapshot(collection(db,"rooms"),snap=>{
    rooms=[];snap.forEach(d=>rooms.push(d.data()));
    let html='';rooms.forEach(r=>html+=`<div class="box" onclick="enterRoom('${r.id}')"><b>${r.name}</b><br>المالك: ${r.owner}</div>`);
    document.getElementById('roomsList').innerHTML=html||'<p>لا توجد غرف</p>';
  });
}

window.openCreateRoom=()=>document.getElementById('createRoomModal').style.display='block';
window.createRoom=async()=>{
  let name=document.getElementById('newRoomName').value.trim();
  if(!name)return;if(coins<80000)return alert("تحتاج 80000");
  coins-=80000;let id='RM'+Math.floor(100000+Math.random()*900000);
  await setDoc(doc(db,"rooms",id),{id,name,owner:currentUser});
  updateUI();closeModal('createRoomModal');enterRoom(id);
}

window.enterRoom=(id)=>{
  currentRoom=rooms.find(r=>r.id==id);
  document.getElementById('roomNameTitle').innerText=currentRoom.name;
  showPage('chatRoom',null);
  if(unsubRoomChat)unsubRoomChat();
  unsubRoomChat=onSnapshot(doc(db,"roomMessages",id),snap=>{
    let msgs=snap.exists()?snap.data().messages||[]:[];
    let box=document.getElementById('roomChatBox');box.innerHTML='';
    msgs.forEach(m=>box.innerHTML+=`<div class="chatMsg ${m.u==currentUser?'me':'other'}"><b>${m.u}:</b> ${m.t}</div>`);
    box.scrollTop=box.scrollHeight;
  });
}

window.sendRoomMsg=async()=>{
  let txt=document.getElementById('roomChatInput').value.trim();if(!txt||!currentRoom)return;
  await setDoc(doc(db,"roomMessages",currentRoom.id),{messages:arrayUnion({u:currentUser,t:txt,time:Date.now()})},{merge:true});
  document.getElementById('roomChatInput').value='';
    }
    // XO
let xoBoard=Array(9).fill(''),xoTurn='X';
window.openXO=()=>{if(coins<50)return alert("50");coins-=50;updateUI();xoBoard=Array(9).fill('');document.getElementById('xoModal').style.display='block';renderXO()}
function renderXO(){let b=document.getElementById('xoBoard');b.innerHTML='';xoBoard.forEach((v,i)=>b.innerHTML+=`<div class="xoCell" onclick="playXO(${i})">${v}</div>`)}
window.playXO=(i)=>{if(xoBoard[i]||checkXO())return;xoBoard[i]='X';renderXO();botXO()}

// العجلة والصندوق والميموري نفس كودك السابق بس مضاف updateUI()

// دومينو جماعي
window.openMultiplayerGame=async(type)=>{
  if(type=='domino'){
    let gameId='DOM'+Date.now();
    await setDoc(doc(db,"games",gameId),{type,players:[currentUser],turn:currentUser,tiles:[],table:[]});
    document.getElementById('dominoMPModal').style.display='block';
    onSnapshot(doc(db,"games",gameId),snap=>{/* رسم الدومينو */})
  }
  if(type=='ludo'){
    document.getElementById('ludoMPModal').style.display='block';
  }
}
    function checkXO(){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let w of wins){if(xoBoard[w[0]]&&xoBoard[w[0]]==xoBoard[w[1]]&&xoBoard[w[1]]==xoBoard[w[2]]){document.getElementById('xoResult').innerText='فزت';coins+=150;updateUI();return true}}
  if(!xoBoard.includes('')){document.getElementById('xoResult').innerText='تعادل';return true}
  return false;
}
function botXO(){let e=xoBoard.map((v,i)=>v==''?i:null).filter(v=>v!=null);if(e.length){xoBoard[e[0]]='O';renderXO();checkXO()}}

window.spinWheel=()=>{if(coins<50)return;coins-=50;let p=[100,200,0,300][Math.floor(Math.random()*4)];coins+=p;document.getElementById('wheelResult').innerText=p?`ربحت ${p}`:'حظ اوفر';document.getElementById('wheelModal').style.display='block';updateUI()}
window.openBox=()=>{if(coins<500)return;coins-=500;let p=[200,800,1000][Math.floor(Math.random()*3)];coins+=p;document.getElementById('boxResult').innerText=`ربحت ${p}`;document.getElementById('boxModal').style.display='block';updateUI()}
window.openMemory=()=>{document.getElementById('memoryModal').style.display='block';}
</script>
</body>
</html>
