<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرافدين</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:white;font-family:'Tahoma'}
.app{max-width:430px;margin:0 auto;background:#0d1b4d;min-height:100vh;padding-bottom:70px}
.header{text-align:center;padding:15px}
.header h1{color:#00e5ff}
.card{background:#111827;margin:12px;border-radius:15px;padding:20px}
.points{font-size:45px;color:#22c55e;text-align:center;font-weight:bold}
.rate{color:#00e5ff;text-align:center;margin:8px 0}
.timer{font-size:20px;color:#facc15;text-align:center;margin:8px 0}
.btn{background:#2563eb;color:white;border:0;padding:14px;border-radius:12px;width:100%;font-size:16px;margin:8px 0;cursor:pointer}
.btn:disabled{background:#444;color:#777}
.nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#0a0f1e;display:flex}
.nav button{flex:1;background:none;border:0;color:#aaa;padding:12px 0}
.nav button.active{color:#00e5ff}
.page{display:none}.page.active{display:block}
.item{background:#1f2937;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between}
.input{width:100%;padding:10px;border-radius:8px;border:0;background:#1f2937;color:white;margin:6px 0}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#ef4444;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:999}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:260px;margin:10px auto}
.cell{background:#1f2937;height:80px;border-radius:12px;font-size:40px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">

<div id="home" class="page active">
<div class="header"><h1>🔥 الرافدين 🔥</h1></div>
<div class="card">
<h3 style="text-align:center">رصيدك</h3>
<div class="points" id="points">1000</div>
<div class="rate" id="rateInfo">عدادك: 100</div>
<div class="timer" id="timer">23:59:59</div>
<button class="btn" id="collectBtn" onclick="collect()">اجمع النقاط</button>
</div>
</div>

<div id="games" class="page">
<div class="card">
<h3 style="text-align:center">الالعاب</h3>
<button class="btn" onclick="spin()">عجلة الحظ -50</button>
<button class="btn" onclick="startXO()">XO -50</button>
<button class="btn" onclick="box()">صندوق -500</button>
</div>
</div>

<div id="xo" class="page">
<div class="card">
<h3 style="text-align:center">XO</h3>
<div class="board" id="board"></div>
<p id="xoText" style="text-align:center">دورك</p>
<button class="btn" onclick="show('games')">رجوع</button>
</div>
</div>

<div id="tasks" class="page">
<div class="card">
<h3 style="text-align:center">المهام</h3>
<div id="taskList"></div>
<h3 style="text-align:center;margin-top:15px">تحويل</h3>
<p style="text-align:center">كودك: <b id="myCode" style="color:#22c55e"></b></p>
<input id="transferCode" placeholder="كود الصديق" class="input">
<input id="transferAmount" type="number" placeholder="المبلغ" class="input">
<button class="btn" onclick="transfer()">تحويل</button>
</div>
</div>

<div id="shop" class="page">
<div class="card">
<h3 style="text-align:center">المتجر</h3>
<div id="shopList"></div>
</div>
</div>

</div>

<div class="nav">
<button onclick="show('home')" class="active">العداد</button>
<button onclick="show('games')">العاب</button>
<button onclick="show('tasks')">مهام</button>
<button onclick="show('shop')">متجر</button>
</div>

<script>
// نظام تخزين واحد بسيط
let DB = JSON.parse(localStorage.getItem('rafidain_v2')) || {};
let myCode = localStorage.getItem('myCode') || 'RAF'+Math.floor(Math.random()*9000);
localStorage.setItem('myCode', myCode);

if(!DB[myCode]) DB[myCode] = {points:1000, rate:100, last:0, tasks:[]};

function save(){
DB[myCode] = data;
localStorage.setItem('rafidain_v2', JSON.stringify(DB));
}

let data = DB[myCode];
let board = ['', '', '', '', '', '', '', '', ''];
let gameOver = false;

function showToast(msg){
let t = document.getElementById('toast');
t.innerText = msg;
t.style.display = 'block';
setTimeout(()=>t.style.display='none',2000);
}

function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active');
event.target.classList.add('active');
}

function update(){
data = DB[myCode];
document.getElementById('points').innerText = data.points;
document.getElementById('rateInfo').innerText = 'عدادك: ' + data.rate;
document.getElementById('myCode').innerText = myCode;

let left = 86400000 - (Date.now() - data.last); if(left<0) left=0;
let h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);
document.getElementById('timer').innerText = h+':'+m+':'+s;
document.getElementById('collectBtn').disabled = left>0;
document.getElementById('collectBtn').innerText = left<=0? 'اجمع '+data.rate : 'انتظر';

if(data.tasks.length==0){
data.tasks = [
{text:"اجمع 5 مرات",prog:0,need:5,reward:500},
{text:"اشتري عداد",prog:0,need:1,reward:1000}
];
}

let tHtml='';
data.tasks.forEach((t,i)=>{tHtml+=`<div class="item"><span>${t.text}</span><button class="btn" style="width:80px" onclick="claim(${i})" ${t.prog<t.need?'disabled':''}>${t.done?'تم':t.prog+'/'+t.need}</button></div>`;});
document.getElementById('taskList').innerHTML=tHtml;

let shop='';
[{r:100,p:1000},{r:500,p:5000},{r:1000,p:10000},{r:5000,p:50000}].forEach(x=>{
shop+=`<div class="item"><span>+${x.r} للعداد</span><button class="btn" style="width:100px" onclick="buy(${x.r},${x.p})" ${data.points<x.p?'disabled':''}>${x.p}</button></div>`;
});
document.getElementById('shopList').innerHTML=shop;
}

function collect(){
if(Date.now()-data.last<86400000) return;
data.points += data.rate;
data.last = Date.now();
data.tasks[0].prog++;
save(); update();
}

function buy(r,p){
if(data.points<p){showToast('نقاطك قليلة'); return;}
data.points -= p;
data.rate += r; // تراكمي
data.tasks[1].prog++;
save(); update();
showToast('تم الشراء +'+r);
}

function transfer(){
let code = document.getElementById('transferCode').value.toUpperCase();
let amount = parseInt(document.getElementById('transferAmount').value);
if(!code ||!amount){showToast('دخل الكود والمبلغ'); return;}
if(amount>data.points){showToast('ماعندك نقاط'); return;}
if(!DB[code]) DB[code] = {points:0, rate:100, last:0, tasks:[]};
data.points -= amount;
DB[code].points += amount;
save();
showToast('تم التحويل');
document.getElementById('transferCode').value='';
document.getElementById('transferAmount').value='';
update();
}

function spin(){
if(data.points<50){showToast('تحتاج 50'); return;}
data.points-=50;
let win = [100,200,500][Math.floor(Math.random()*3)];
data.points+=win;
save(); update();
showToast('ربحت '+win);
}

function startXO(){
if(data.points<50){showToast('تحتاج 50'); return;}
data.points-=50; save(); update();
board = ['','','','','','','']; gameOver=false;
renderXO(); show('xo');
}
function renderXO(){
let h=''; for(let i=0;i<9;i++) h+=`<div class="cell" onclick="play(${i})">${board[i]}</div>`;
document.getElementById('board').innerHTML=h;
}
function play(i){
if(board[i]||gameOver) return;
board[i]='X'; renderXO();
if(board[0]=='X'&&board[1]=='X'&&board[2]=='X'){gameOver=true; data.points+=500; save(); update(); showToast('فزت'); return;}
let e = board.map((v,j)=>v?'':j).filter(x=>x!=='');
if(e.length){board[e[0]]='O'; renderXO();}
save(); update();
}

function box(){
if(data.points<500){showToast('تحتاج 500'); return;}
data.points-=500; let win = 1000;
data.points+=win; save(); update(); showToast('ربحت '+win);
}

function claim(i){
if(data.tasks[i].prog>=data.tasks[i].need){
data.points += data.tasks[i].reward;
data.tasks[i].done=true;
save(); update();
}
}

setInterval(update,1000);
update();
</script>
</body>
</html>
