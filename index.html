<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تطبيق الرافدين</title><style>*{box-sizing:border-box}body{background:#000;color:white;font-family:tahoma;text-align:center;padding:10px;margin:0;padding-bottom:100px}#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a1a3a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;animation:f 1s 3.5s forwards}@keyframes f{to{opacity:0}}.logo{font-size:50px}.page{display:none}.page.active{display:block}.box{border:3px solid #3b82f6;border-radius:18px;padding:20px;margin:15px 0;background:#111}#coins{font-size:36px;color:#00ff00}.btn{background:#3b82f6;color:#fff;border:none;padding:16px;border-radius:15px;width:90%}.btn-green{background:#00ff00;color:#000}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000}.modal-content{background:#1a1a1a;margin:20px auto;padding:15px;width:95%;border-radius:15px;border:2px solid #3b82f6}.input{width:90%;padding:12px;margin:8px;border-radius:8px;background:#222;color:white;border:1px solid #3b82f6}.bottomNav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:95%;background:#1e3a8a;border-radius:25px;display:flex;justify-content:space-around;padding:10px}#registerPage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9998;display:flex;flex-direction:column;justify-content:center;align-items:center}.roomItem{background:#222;padding:15px;margin:10px;border-radius:12px;border:2px solid #3b82f6;text-align:right}.chatBox{height:300px;overflow-y:auto;background:#0a0a0a;border:2px solid #3b82f6;border-radius:15px;padding:10px}.giftBtn{font-size:24px;padding:8px;margin:4px;background:#333;border:2px solid #3b82f6}</style></head><body><div id="splash"><div class="logo">🏛️</div><div style="color:#3b82f6;font-size:28px">AL-RAFIDAIN</div></div><div id="registerPage"><div class="logo">🏛️</div><h1>انشاء حساب</h1><div class="box"><input id="regName" class="input" placeholder="اسمك"><input id="regPass" type="password" class="input" placeholder="كلمة السر"><input id="regRef" class="input" placeholder="رمز الاحالة"><button class="btn btn-green" onclick="createAccount()">تسجيل</button></div></div><div id="mainApp" style="display:none"><div class="logo">🏛️</div><h1>تطبيق الرافدين</h1><div id="home" class="page active"><div class="box"><h3>💰 الرصيد</h3><div id="coins">0 نقطة</div><div id="coinsDollar">$0.00</div></div><div class="box"><h3>⚙️ عدادك</h3><div id="dailyProfit">0</div></div><div class="box"><h3>⚡ باليوم</h3><div id="perDay">0</div></div></div><div id="store" class="page"><h2>🛒 المتجر</h2><div id="storeList"></div></div><div id="games" class="page"><h2>🎮 الالعاب</h2><button class="btn" onclick="openXO()">XO</button><button class="btn" onclick="openChallenge()">تحدي</button></div><div id="rooms" class="page"><h2>🏠 الغرف</h2><div id="myRoomSection"></div><button class="btn btn-green" onclick="openCreateRoom()">انشاء غرفة 80000</button><div id="roomsList"></div></div><div id="chatRoom" class="page"><button class="btn" onclick="showPage('rooms')">رجوع</button><h2 id="roomNameTitle"></h2><button id="editRoomBtn" class="btn" style="display:none" onclick="editRoomName()">تعديل الاسم</button><div id="roomChatBox" class="chatBox"></div><input id="roomChatInput" class="input"><button class="btn" onclick="sendRoomMsg()">ارسال</button><div id="giftsBar"></div></div><div id="referral" class="page"><h2>🎁 الاحالة</h2><div id="myReferralCode" class="box"></div><div id="myReferralLink" class="box"></div></div><div id="log" class="page"><h2>📜 السجل</h2><div id="logList"></div></div><div id="profile" class="page"><h2>👤 الملف</h2><h3 id="userName"></h3><button class="btn" onclick="logout()">خروج</button></div><div id="xoModal" class="modal"><div class="modal-content"><div id="xoBoard"></div><button class="btn" onclick="closeModal('xoModal')">خروج</button></div></div><div id="challengeModal" class="modal"><div class="modal-content"><input id="challengeUser" class="input" placeholder="اسم الخصم"><input id="challengeBet" class="input" placeholder="الرهان"><button class="btn" onclick="sendChallenge()">ارسال</button></div></div><div id="createRoomModal" class="modal"><div class="modal-content"><input id="newRoomName" class="input" placeholder="اسم الغرفة"><button class="btn" onclick="createRoom()">انشاء</button></div></div><div class="bottomNav"><div onclick="showPage('store')">🛒</div><div onclick="showPage('home')">⚙️</div><div onclick="showPage('games')">🎮</div><div onclick="showPage('rooms')">🏠</div><div onclick="showPage('referral')">🎁</div><div onclick="showPage('log')">📜</div><div onclick="showPage('profile')">👤</div></div></div><script>let coins=5000,dailyProfitTotal=0,lastClaim=0,currentUser='',rooms=JSON.parse(localStorage.getItem('rooms'))||[],roomMessages=JSON.parse(localStorage.getItem('roomMessages'))||{},currentRoom=null;const countersData=[{n:"100",p:1000,pr:100},{n:"200",p:2000,pr:200},{n:"500",p:5000,pr:500},{n:"1000",p:10000,pr:1000}];const giftsList=[{i:"🌹",n:"وردة",pr:1000},{i:"💎",n:"الماس",pr:5000},{i:"👑",n:"تاج",pr:10000},{i:"🚀",n:"صاروخ",pr:20000},{i:"🏆",n:"كاس",pr:50000},{i:"💰",n:"فلوس",pr:100000},{i:"🔥",n:"نار",pr:500},{i:"❤️",n:"قلب",pr:2000},{i:"🎉",n:"احتفال",pr:8000},{i:"🌟",n:"نجمة",pr:25000}];setTimeout(()=>{document.getElementById('splash').style.display='none';checkLogin()},3500);function checkLogin(){currentUser=localStorage.getItem('u');if(currentUser){loadData();document.getElementById('registerPage').style.display='none';document.getElementById('mainApp').style.display='block'}}function createAccount(){let n=document.getElementById('regName').value,p=document.getElementById('regPass').value;if(!n||!p)return alert("كمل");localStorage.setItem('u',n);localStorage.setItem('coins',5000);localStorage.setItem('dp',0);localStorage.setItem('ref','RAF'+Math.floor(Math.random()*9000+1000));localStorage.setItem('hasRoom','f');currentUser=n;loadData();document.getElementById('registerPage').style.display='none';document.getElementById('mainApp').style.display='block'}function loadData(){coins=parseInt(localStorage.getItem('coins'))||5000;dailyProfitTotal=parseInt(localStorage.getItem('dp'))||0;document.getElementById('userName').innerText=currentUser;updateAll()}function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(id=='store')loadStore();if(id=='rooms')loadRooms();if(id=='referral')setupRef()}function updateAll(){document.getElementById('coins').innerText=coins+' نقطة';document.getElementById('coinsDollar').innerText='$'+(coins/10000).toFixed(2);document.getElementById('dailyProfit').innerText=dailyProfitTotal;document.getElementById('perDay').innerText='+'+dailyProfitTotal;localStorage.setItem('coins',coins);localStorage.setItem('dp',dailyProfitTotal)}function loadStore(){let h='';countersData.forEach(c=>{h+=`<div class="box"><h4>عداد ${c.n}</h4><p>${c.p} نقطة</p><button class="btn" onclick="buy(${c.p},${c.pr})">شراء</button></div>`});document.getElementById('storeList').innerHTML=h}function buy(price,profit){if(coins<price)return alert("ماكو");coins-=price;dailyProfitTotal+=profit;updateAll()}function setupRef(){let code=localStorage.getItem('ref');document.getElementById('myReferralCode').innerText=code;document.getElementById('myReferralLink').innerText='rafidain.com/ref='+code}function openXO(){document.getElementById('xoModal').style.display='block';document.getElementById('xoBoard').innerHTML='XO هنا'}function closeModal(id){document.getElementById(id).style.display='none'}function openChallenge(){document.getElementById('challengeModal').style.display='block'}function sendChallenge(){alert("تم ارسال التحدي");closeModal('challengeModal')}function openCreateRoom(){if(localStorage.getItem('hasRoom')=='t')return alert("عندك غرفة");document.getElementById('createRoomModal').style.display='block'}function createRoom(){let name=document.getElementById('newRoomName').value;if(!name)return;if(coins<80000)return alert("ماكو 80000");coins-=80000;let id='RM'+Math.floor(Math.random()*900000+100000);rooms.push({id:id,name:name,owner:currentUser});localStorage.setItem('rooms',JSON.stringify(rooms));localStorage.setItem('hasRoom','t');updateAll();closeModal('createRoomModal');alert("تم "+id)}function loadRooms(){let h='';rooms.forEach(r=>{h+=`<div class="roomItem" onclick="enter('${r.id}')"><h4>${r.name}</h4><div>${r.id}</div></div>`});document.getElementById('roomsList').innerHTML=h;let has=localStorage.getItem('hasRoom');document.getElementById('myRoomSection').innerHTML=has=='t'?'<button class="btn" onclick="myRoom()">غرفتي</button>':''}function enter(id){currentRoom=rooms.find(r=>r.id==id);document.getElementById('roomNameTitle').innerText=currentRoom.name;if(currentRoom.owner==currentUser)document.getElementById('editRoomBtn').style.display='block';showPage('chatRoom');loadChat();let g='';giftsList.forEach(gf=>{g+=`<button class="giftBtn" onclick="sendGift('${gf.i}','${gf.n}',${gf.pr})">${gf.i} ${gf.pr}</button>`});document.getElementById('giftsBar').innerHTML=g}function myRoom(){let r=rooms.find(r=>r.owner==currentUser);if(r)enter(r.id)}function editRoomName(){let nn=prompt("الاسم الجديد");if(nn){currentRoom.name=nn;rooms=rooms.map(r=>r.id==currentRoom.id?currentRoom:r);localStorage.setItem('rooms',JSON.stringify(rooms));document.getElementById('roomNameTitle').innerText=nn}}function sendRoomMsg(){let m=document.getElementById('roomChatInput').value;if(!m)return;if(!roomMessages[currentRoom.id])roomMessages[currentRoom.id]=[];roomMessages[currentRoom.id].push({u:currentUser,t:m});localStorage.setItem('roomMessages',JSON.stringify(roomMessages));document.getElementById('roomChatInput').value='';loadChat()}function loadChat(){let b=document.getElementById('roomChatBox');b.innerHTML='';(roomMessages[currentRoom.id]||[]).forEach(m=>{b.innerHTML+=`<div>${m.u}: ${m.t}</div>`})}function sendGift(icon,name,price){if(coins<price)return alert("ماكو نقاط");coins-=price;if(!roomMessages[currentRoom.id])roomMessages[currentRoom.id]=[];roomMessages[currentRoom.id].push({u:currentUser,t:`${icon} ارسل ${name} بـ ${price}`});localStorage.setItem('roomMessages',JSON.stringify(roomMessages));updateAll();loadChat()}function logout(){localStorage.clear();location.reload()}</script></body></html>
