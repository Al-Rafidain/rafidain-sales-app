<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>الرافدين كامل</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:tahoma;text-align:center;padding:10px;padding-bottom:100px}
.logo{font-size:50px;margin:15px}h1{color:#3b82f6;text-shadow:0 0 15px #3b82f6}
.page{display:none}.page.active{display:block}
.box{border:3px solid #3b82f6;border-radius:18px;padding:20px;margin:15px auto;background:#111;max-width:420px}
#coins,#dailyProfit{font-size:36px;font-weight:bold}#coins{color:#0f0}#dailyProfit{color:#ffb300}
.btn{background:#3b82f6;color:#fff;border:0;padding:16px;border-radius:15px;font-size:16px;font-weight:bold;margin:10px auto;cursor:pointer;width:90%;display:block}
.btn-green{background:#0f0;color:#000}.btn-red{background:#f33}.btn:disabled{opacity:.5}
.input{width:90%;padding:12px;margin:8px 0;border-radius:8px;background:#222;color:#fff;border:1px solid #3b82f6}
.bottomNav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:95%;background:linear-gradient(135deg,#1e3a8a,#3b82f6);border-radius:25px;display:flex;padding:10px}
.navItem{color:#ddd;font-size:14px;cursor:pointer;flex:1;font-weight:bold}.navItem.active{color:#fff}
.chatBox{height:250px;overflow-y:auto;background:#0a0a0a;border:2px solid #3b82f6;border-radius:15px;padding:10px;text-align:right}
.chatMsg{margin:8px 0;padding:8px 12px;border-radius:10px}.chatMsg.me{background:#3b82f6;margin-right:auto;text-align:left}.chatMsg.other{background:#222;margin-left:auto}
.micGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.micSeat{background:#222;border:2px solid #3b82f6;border-radius:10px;padding:10px;cursor:pointer}.micSeat.active{border-color:#0f0;background:#002200}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000}
.modal-content{background:#1a1a1a;margin:20px auto;padding:15px;width:95%;max-width:500px;border-radius:15px;border:2px solid #3b82f6}
.roomItem{background:#222;padding:15px;margin:10px 0;border-radius:12px;border:2px solid #3b82f6;text-align:right;cursor:pointer}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0c0;color:#000;padding:15px 25px;border-radius:10px;display:none;z-index:9999}
#xoBoard,#memoryBoard{display:grid;gap:5px;margin:20px auto;justify-content:center}
#xoBoard{grid-template-columns:repeat(3,90px);width:280px}
#memoryBoard{grid-template-columns:repeat(4,60px)}
.xoCell,.memCell{width:90px;height:90px;background:#222;font-size:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #3b82f6;border-radius:10px}
.memCell{width:60px;height:60px;font-size:30px}
.counterItem{background:#222;padding:15px;margin:10px auto;border-radius:10px;border:2px solid #333;width:90%}
</style>
</head>
<body>

<div id="registerPage"><div class="logo">🏛️</div><h1>تسجيل الدخول</h1><div class="box"><input type="text" id="regName" class="input" placeholder="اسمك"><input type="password" id="regPass" class="input" placeholder="كلمة السر"><button class="btn btn-green" onclick="createAccount()">دخول</button></div></div>

<div id="mainApp" style="display:none">
  <div class="logo">🏛️</div><h1>تطبيق الرافدين</h1>
  <div id="home" class="page active">
    <div class="box"><h3>الرصيد 💰</h3><div id="coins">0</div><div id="coinsDollar">$0</div><button class="btn btn-green" onclick="alert('السحب قريبا')">💵 سحب</button></div>
    <div class="box"><h3>عدادك ⚙️</h3><div id="dailyProfit">0</div></div>
    <button class="btn btn-green" onclick="claimProfit()">استلام الارباح</button>
  </div>

  <div id="store" class="page"><h2>🛒 المتجر</h2><div id="coins2" class="box"></div><div id="storeList"></div></div>

  <div id="games" class="page"><h2>🎮 الالعاب</h2><div id="coins3" class="box"></div>
    <button class="btn" onclick="openXO()">❌⭕ XO - 50</button>
    <button class="btn" onclick="spinWheel()">🎡 العجلة - 50</button>
    <button class="btn" onclick="openBox()">📦 الصندوق - 500</button>
    <button class="btn" onclick="openMemory()">🧠 ميموري - 50</button>
  </div>

  <div id="rooms" class="page"><h2>🏠 الغرف</h2><button class="btn btn-green" onclick="openCreateRoom()">➕ انشاء غرفة - 80000</button><div id="roomsList"></div></div>

  <div id="chatRoom" class="page">
    <button class="btn" onclick="showPage('rooms',null)">🔙 رجوع</button><h2 id="roomNameTitle"></h2>
    <div class="box"><h3 style="color:#0f0">🎙️ مايكات - 7</h3><div class="micGrid" id="roomMicsGrid"></div><button id="kickBtn" class="btn btn-red" style="display:none" onclick="openKickModal()">🚫 طرد من المايك</button></div>
    <div id="roomChatBox" class="chatBox"></div><input type="text" id="roomChatInput" class="input" placeholder="اكتب"><button class="btn" onclick="sendRoomMsg()">ارسال</button>
  </div>

  <div class="bottomNav">
    <div class="navItem active" onclick="showPage('home',this)">العداد</div>
    <div class="navItem" onclick="showPage('store',this)">المتجر</div>
    <div class="navItem" onclick="showPage('games',this)">الالعاب</div>
    <div class="navItem" onclick="showPage('rooms',this)">الغرف</div>
  </div>
</div>

<div id="createRoomModal" class="modal"><div class="modal-content"><input id="newRoomName" class="input" placeholder="اسم الغرفة"><button class="btn btn-green" onclick="createRoom()">انشاء - 80000</button><button class="btn btn-red" onclick="closeModal('createRoomModal')">الغاء</button></div></div>
<div id="kickModal" class="modal"><div class="modal-content"><h2>طرد عضو</h2><div id="kickList"></div><button class="btn btn-red" onclick="closeModal('kickModal')">الغاء</button></div></div>
<div id="xoModal" class="modal"><div class="modal-content"><h2>XO ضد البوت</h2><div id="xoBoard"></div><p id="xoResult"></p><button class="btn" onclick="closeModal('xoModal')">خروج</button></div></div>
<div id="wheelModal" class="modal"><div class="modal-content"><h2>عجلة الحظ</h2><button class="btn" onclick="doSpin()">لف - 50</button><p id="wheelResult"></p><button class="btn" onclick="closeModal('wheelModal')">اغلاق</button></div></div>
<div id="boxModal" class="modal"><div class="modal-content"><h2>الصندوق السحري</h2><button class="btn" onclick="doBox()">افتح - 500</button><p id="boxResult"></p><button class="btn" onclick="closeModal('boxModal')">اغلاق</button></div></div>
<div id="memoryModal" class="modal"><div class="modal-content"><h2>ميموري</h2><div id="memoryBoard"></div><p id="memoryResult"></p><button class="btn" onclick="closeModal('memoryModal')">خروج</button></div></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBbkpcBPq8G2OpyKxaVqPO7Mkfla4X9hxU",authDomain: "rafidainapp.firebaseapp.com",projectId: "rafidainapp",appId: "1:512875147812:web:54f33bda3780db7a4a9eb1"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let coins=5000,dailyProfitTotal=0,lastClaim=0,currentUser='',rooms=[],currentRoom=null;
const RATE=10000; let unsubRoomChat=null, unsubRoomDoc=null;
const countersData = [{name:"عداد 100", price:1000, profit:100},{name:"عداد 500", price:5000, profit:500},{name:"عداد 1000", price:10000, profit:1000},{name:"عداد 5000", price:50000, profit:5000}];

window.onload = checkLogin;
async function checkLogin(){currentUser=localStorage.getItem('rafidain_user');if(currentUser){await loadUserData();document.getElementById('registerPage').style.display='none';document.getElementById('mainApp').style.display='block';listenToRooms();}else{document.getElementById('registerPage').style.display='block';}}

async function createAccount(){let name=document.getElementById('regName').value.trim();let pass=document.getElementById('regPass').value.trim();if(!name||!pass)return alert("دخل البيانات");await setDoc(doc(db,"users",name),{name,pass,coins:5000,dailyProfit:0,lastClaim:Date.now()},{merge:true});currentUser=name;localStorage.setItem('rafidain_user',name);location.reload();}
async function loadUserData(){const snap=await getDoc(doc(db,"users",currentUser));if(snap.exists()){let d=snap.data();coins=d.coins||5000;dailyProfitTotal=d.dailyProfit||0;lastClaim=d.lastClaim||0;updateUI();}}
function updateUI(){document.getElementById('coins').innerText=coins.toLocaleString();document.getElementById('coins2').innerText='رصيدك: '+coins.toLocaleString();document.getElementById('coins3').innerText='رصيدك: '+coins.toLocaleString();document.getElementById('coinsDollar').innerText=`$${(coins/RATE).toFixed(2)}`;document.getElementById('dailyProfit').innerText=dailyProfitTotal.toLocaleString();if(currentUser)setDoc(doc(db,"users",currentUser),{coins,dailyProfit:dailyProfitTotal,lastClaim},{merge:true});}
window.showPage=(id,el)=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.navItem').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');if(el)el.classList.add('active');if(id=='store')loadStore();}
window.closeModal=(id)=>document.getElementById(id).style.display='none';
function showToast(msg){let t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}

window.claimProfit=()=>{let now=Date.now();if(now-lastClaim>10000){coins+=dailyProfitTotal;lastClaim=now;updateUI();showToast(`+${dailyProfitTotal}`);}else{alert("انتظر 10 ثواني للتجربة")}}

function loadStore(){let html='';countersData.forEach(c=>{html+=`<div class="counterItem"><h4>${c.name}</h4><p>السعر: ${c.price}</p><p>الربح: ${c.profit}/يوم</p><button class="btn" onclick="buyCounter(${c.price},${c.profit})" ${coins<c.price?'disabled':''}>شراء</button></div>`});document.getElementById('storeList').innerHTML=html;}
window.buyCounter=(p,pr)=>{if(coins<p)return alert("نقاطك لا تكفي");coins-=p;dailyProfitTotal+=pr;updateUI();loadStore();showToast("تم شراء العداد")}

function listenToRooms(){onSnapshot(collection(db,"rooms"),snap=>{rooms=[];snap.forEach(d=>rooms.push(d.data()));let html='';rooms.forEach(r=>html+=`<div class="roomItem" onclick="enterRoom('${r.id}')"><b>${r.name}</b><br>المالك: ${r.owner}</div>`);document.getElementById('roomsList').innerHTML=html||'لا توجد غرف';});}
window.openCreateRoom=()=>document.getElementById('createRoomModal').style.display='block';
window.createRoom=async()=>{let name=document.getElementById('newRoomName').value.trim();if(!name)return;if(coins<80000)return alert("تحتاج 80000");coins-=80000;let id='RM'+Date.now();await setDoc(doc(db,"rooms",id),{id,name,owner:currentUser,mics:Array(7).fill(null)});updateUI();closeModal('createRoomModal');enterRoom(id);}

window.enterRoom=(id)=>{currentRoom=rooms.find(r=>r.id==id);document.getElementById('roomNameTitle').innerText=currentRoom.name;document.getElementById('kickBtn').style.display=currentRoom.owner==currentUser?'block':'none';showPage('chatRoom',null);if(unsubRoomDoc)unsubRoomDoc();unsubRoomDoc=onSnapshot(doc(db,"rooms",id),snap=>{if(snap.exists()){currentRoom=snap.data();renderMics()}});if(unsubRoomChat)unsubRoomChat();unsubRoomChat=onSnapshot(doc(db,"roomMessages",id),snap=>{let msgs=snap.exists()?snap.data().messages||[]:[];let box=document.getElementById('roomChatBox');box.innerHTML='';msgs.forEach(m=>box.innerHTML+=`<div class="chatMsg ${m.u==currentUser?'me':'other'}"><b>${m.u}:</b> ${m.t}</div>`);box.scrollTop=box.scrollHeight;});}
window.sendRoomMsg=async()=>{let txt=document.getElementById('roomChatInput').value.trim();if(!txt||!currentRoom)return;await setDoc(doc(db,"roomMessages",currentRoom.id),{messages:arrayUnion({u:currentUser,t:txt,time:Date.now()})},{merge:true});document.getElementById('roomChatInput').value='';}

function renderMics(){let grid=document.getElementById('roomMicsGrid');let mics=currentRoom.mics||Array(7).fill(null);let html='';mics.forEach((m,idx)=>{html+=`<div class="micSeat ${m?'active':''}" onclick="toggleMic(${idx})">${m?m:'مايك '+(idx+1)}</div>`});grid.innerHTML=html;}
window.toggleMic=async(idx)=>{let mics=[...currentRoom.mics];if(mics[idx]==currentUser){mics[idx]=null;}else if(mics[idx]==null){mics[idx]=currentUser;}else{return alert("المايك مشغول")}await updateDoc(doc(db,"rooms",currentRoom.id),{mics});}
window.openKickModal=()=>{let users=new Set();(currentRoom.mics||[]).forEach(m=>{if(m)users.add(m)});let html='';users.forEach(u=>{if(u!=currentUser)html+=`<button class="btn btn-red" onclick="kickUser('${u}')">طرد ${u}</button>`});document.getElementById('kickList').innerHTML=html;document.getElementById('kickModal').style.display='block';}
window.kickUser=async(u)=>{let mics=[...currentRoom.mics];mics=mics.map(x=>x==u?null:x);await updateDoc(doc(db,"rooms",currentRoom.id),{mics});closeModal('kickModal');showToast('تم الطرد')}

// الالعاب
let xoBoard=Array(9).fill('');
window.openXO=()=>{if(coins<50)return alert("تحتاج 50");coins-=50;updateUI();xoBoard=Array(9).fill('');document.getElementById('xoModal').style.display='block';renderXO()}
function renderXO(){let b=document.getElementById('xoBoard');b.innerHTML='';xoBoard.forEach((v,i)=>b.innerHTML+=`<div class="xoCell" onclick="playXO(${i})">${v}</div>`)}
window.playXO=(i)=>{if(xoBoard[i])return;xoBoard[i]='X';renderXO();if(checkWin('X')){coins+=150;updateUI();document.getElementById('xoResult').innerText='فزت 150';return;}let e=xoBoard.map((v,i)=>v==''?i:null).filter(v=>v!=null);if(e.length){xoBoard[e[0]]='O';renderXO();if(checkWin('O'))document.getElementById('xoResult').innerText='خسرت';}}
function checkWin(p){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(x=>xoBoard[x[0]]==p&&xoBoard[x[1]]==p&&xoBoard[x[2]]==p)}

window.spinWheel=()=>{if(coins<50)return alert("50");coins-=50;updateUI();document.getElementById('wheelModal').style.display='block';}
window.doSpin=()=>{let p=[100,200,0,300,500][Math.floor(Math.random()*5)];coins+=p;document.getElementById('wheelResult').innerText=p?`ربحت ${p}`:'حظ اوفر';updateUI();}

window.openBox=()=>{if(coins<500)return alert("500");coins-=500;updateUI();document.getElementById('boxModal').style.display='block';}
window.doBox=()=>{let p=[200,800,1000,50][Math.floor(Math.random()*4)];coins+=p;document.getElementById('boxResult').innerText=`ربحت ${p}`;updateUI();}

let memCards=[],flipped=[],matched=0;
window.openMemory=()=>{if(coins<50)return alert("50");coins-=50;updateUI();matched=0;flipped=[];let icons=['🍎','🍌','🍇','🍓'];memCards=[...icons,...icons].sort(()=>0.5-Math.random());let b=document.getElementById('memoryBoard');b.innerHTML='';memCards.forEach((c,i)=>b.innerHTML+=`<div class="memCell" onclick="flipMem(${i},this)">?</div>`);document.getElementById('memoryModal').style.display='block';}
window.flipMem=(i,el)=>{if(flipped.length==2||el.innerText!='?')return;el.innerText=memCards[i];flipped.push({i,el});if(flipped.length==2){setTimeout(()=>{if(memCards[flipped[0].i]==memCards[flipped[1].i]){matched++;flipped.forEach(f=>f.el.style.background='#0f0');if(matched==4){coins+=250;updateUI();document.getElementById('memoryResult').innerText='فزت 250'}}else{flipped.forEach(f=>f.el.innerText='?')}flipped=[]},800)}}
</script>
</body>
</html>
