<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرافدين</title>
<meta name="theme-color" content="#0066ff">
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body {font-family: 'Tahoma'; background: linear-gradient(135deg, #0a1a3a 0%, #0066ff 100%); color: white; padding-bottom: 70px;}
.container {max-width: 500px; margin: auto; padding: 15px;}
h1 {color: #00ccff; text-align: center; margin-bottom: 10px; font-size: 32px;}
.card {background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; margin: 15px 0;}
.points {font-size: 36px; color: #00ff88; font-weight: bold; text-align: center; margin: 10px 0;}
.circle-timer {width: 200px; height: 200px; margin: 20px auto; position: relative;}
svg {transform: rotate(-90deg);}
.circle-bg {fill: none; stroke: #333; stroke-width: 12;}
.circle-progress {fill: none; stroke: #00ff88; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s linear;}
.timer-text {position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; color: #ffcc00; font-weight: bold;}
button {background: #0066ff; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 5px 0; width: 100%; font-weight: bold;}
button:disabled {background: #555; color: #aaa; cursor: not-allowed;}
.shop-item,.task-item {background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin: 10px 0; text-align: right; display: flex; justify-content: space-between; align-items: center;}
.task-item button {width: 90px; padding: 8px;}
.input {width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 10px 0; background: #222; color: white; text-align: center;}
.wheel {width: 250px; height: 250px; border-radius: 50%; margin: 20px auto; border: 8px solid #ffcc00; display: flex; align-items: center; justify-content: center; font-size: 20px; background: conic-gradient(#0066ff 0deg 60deg, #00ff88 60deg 120deg, #ff0066 120deg 180deg, #ffcc00 180deg 240deg, #9900ff 240deg 300deg, #00ccff 300deg 360deg); transition: transform 4s cubic-bezier(.17,.67,.83,.67);}
.board {display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 280px; height: 280px; margin: 20px auto;}
.cell {background: rgba(255,255,255,0.15); border-radius: 15px; font-size: 50px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; height: 90px;}
.cell:hover {background: rgba(255,255,255,0.25);}
.nav {position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a3a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #0066ff; z-index: 999;}
.nav button {background: none; font-size: 11px; padding: 5px; width: auto;}
.nav button.active {color: #00ccff;}
.page {display: none;}
.page.active {display: block;}
.fly-money {position: fixed; font-size: 24px; color: #00ff88; animation: fly 1s forwards; pointer-events: none; z-index: 9999;}
@keyframes fly {0%{opacity:1; transform:translateY(0)} 100%{opacity:0; transform:translateY(-100px)}}
</style>
</head>
<body>
<div class="container">
    <h1>الرافدين</h1>

    <div id="page-home" class="page active">
        <div class="card">
            <h2 style="text-align:center">رصيدك</h2>
            <div class="points" id="points">0</div>
            <div class="circle-timer">
                <svg width="200" height="200">
                    <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="circle-progress" id="progress" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
                </svg>
                <div class="timer-text" id="timer">23:59:59</div>
            </div>
            <button id="collectBtn" onclick="collect()">اجمع النقاط</button>
        </div>
    </div>

    <div id="page-wheel" class="page">
        <div class="card">
            <h2 style="text-align:center">العاب</h2>
            <p style="text-align:center; color:#ffcc00">كل لعبة = 50 نقطة</p>
            <div class="wheel" id="wheel">لف</div>
            <button id="spinBtn" onclick="spinWheel()">عجلة الحظ - 50 نقطة</button>
            <button id="xoBtn" onclick="startXO()">لعبة XO - 50 نقطة</button>
        </div>
    </div>

    <div id="page-tasks" class="page">
        <div class="card">
            <h2 style="text-align:center">المهام اليومية</h2>
            <p style="text-align:center; font-size:12px; color:#aaa">تتجدد كل 24 ساعة</p>
            <div id="tasks"></div>
        </div>
    </div>

    <div id="page-shop" class="page">
        <div class="card">
            <h2 style="text-align:center">متجر العدادات</h2>
            <div id="shop"></div>
        </div>
    </div>

    <div id="page-withdraw" class="page">
        <div class="card">
            <h2 style="text-align:center">السحب</h2>
            <p>اقل سحب: 100000 نقطة = 10$</p>
            <input type="text" id="withdrawInfo" class="input" placeholder="رقمك او الايميل">
            <button onclick="withdraw()">طلب سحب</button>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="card">
            <h2 style="text-align:center">البروفايل</h2>
            <button onclick="alert('تحتاج استضافة')">ربط حساب كوكل</button>
            <div style="margin-top:15px">
                <label>رمز الاحالة الخاص بك:</label>
                <input type="text" id="refCode" class="input" readonly>
                <button onclick="copyRef()">نسخ الرمز</button>
                <p style="font-size:12px">تاخذ 10% من نقاط اي شخص يدخل برمزك</p>
            </div>
            <div style="margin-top:15px">
                <label>ادخل رمز احالة:</label>
                <input type="text" id="enterRef" class="input" placeholder="ادخل الرقم هنا">
                <button onclick="useRef()">تفعيل الرمز</button>
            </div>
        </div>
    </div>

    <div id="page-xo" class="page">
        <div class="card">
            <h2 style="text-align:center">XO ضد الذكاء الاصطناعي</h2>
            <div class="board" id="board"></div>
            <p id="xoStatus" style="text-align:center">دورك X</p>
            <button onclick="showPage('wheel')">رجوع</button>
        </div>
    </div>
</div>

<div class="nav">
    <button onclick="showPage('home')" id="nav-home" class="active">العداد</button>
    <button onclick="showPage('wheel')" id="nav-wheel">العاب</button>
    <button onclick="showPage('tasks')" id="nav-tasks">المهام</button>
    <button onclick="showPage('shop')" id="nav-shop">المتجر</button>
    <button onclick="showPage('withdraw')" id="nav-withdraw">السحب</button>
    <button onclick="showPage('profile')" id="nav-profile">البروفايل</button>
</div>

<audio id="cashSound" src="https://www.soundjay.com/mechanical/sounds/coin-drop-1.mp3"></audio>

<script>
let userId = localStorage.getItem('userId') || "1";
localStorage.setItem('userId', userId);

let data = JSON.parse(localStorage.getItem('rafidainData_'+userId)) || {
    points: 1000, lastCollect: 0, rate: 100, level: 1,
    refCode: userId,
    referredBy: null, dailyTasks: [], lastTaskReset: 0,
    stats: {collects: 0, spent: 0, spins: 0, xoGames: 0}
};

const shopItems = [
    {level: 1, rate: 100, price: 1000, name: "عداد 100 نقطة"},
    {level: 2, rate: 200, price: 2000, name: "عداد 200 نقطة"},
    {level: 3, rate: 300, price: 3000, name: "عداد 300 نقطة"},
    {level: 4, rate: 400, price: 4000, name: "عداد 400 نقطة"},
    {level: 5, rate: 500, price: 5000, name: "عداد 500 نقطة"},
    {level: 6, rate: 1000, price: 10000, name: "عداد 1000 نقطة"},
    {level: 7, rate: 2000, price: 20000, name: "عداد 2000 نقطة"},
    {level: 8, rate: 3000, price: 30000, name: "عداد 3000 نقطة"},
    {level: 9, rate: 4000, price: 40000, name: "عداد 4000 نقطة"},
    {level: 10, rate: 5000, price: 50000, name: "عداد 5000 نقطة"}
];

const wheelPrizes = [50, 100, 200, 500, 1000, 2000, 5000];
const allTasks = [
    {id: 'login', text: 'سجل دخول يومي', reward: 200},
    {id: 'collect3', text: 'اجمع النقاط 3 مرات', reward: 300},
    {id: 'spend1000', text: 'اصرف 1000 نقطة بالمتجر', reward: 250},
    {id: 'spin1', text: 'لف العجلة مرة وحدة', reward: 150},
    {id: 'playxo', text: 'العب XO مرة وحدة', reward: 200},
    {id: 'share', text: 'شارك رمزك', reward: 300},
    {id: 'reach5k', text: 'اوصل 5000 نقطة', reward: 500},
];

const circumference = 2 * Math.PI * 90;
let board = Array(9).fill('');
let xoGameOver = false;

function save() {localStorage.setItem('rafidainData_'+userId, JSON.stringify(data));}

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-'+page).classList.add('active');
    document.getElementById('nav-'+page).classList.add('active');
}

function formatTime(ms) {
    let totalSeconds = Math.floor(ms / 1000);
    let h = Math.floor(totalSeconds / 3600); let m = Math.floor((totalSeconds % 3600) / 60); let s = totalSeconds % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function flyMoney() {
    let el = document.createElement('div'); el.className = 'fly-money'; el.innerText = '+'+data.rate;
    el.style.left = Math.random()*80+10+'%'; el.style.top = '50%'; document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1000);
}

function updateUI() {
    document.getElementById('points').innerText = data.points.toLocaleString();
    document.getElementById('refCode').value = data.refCode + (data.refCode=="1"? " 👑 المطور" : "");

    let now = Date.now();
    let timeLeft = 24*60*60*1000 - (now - data.lastCollect);
    if(timeLeft < 0) timeLeft = 0;
    document.getElementById('timer').innerText = formatTime(timeLeft);
    let progress = 1 - (timeLeft / (24*60*60*1000));
    let offset = circumference - (progress * circumference);
    document.getElementById('progress').style.strokeDashoffset = offset;
    document.getElementById('collectBtn').disabled = timeLeft > 0;
    document.getElementById('collectBtn').innerText = timeLeft <= 0? `اجمع ${data.rate.toLocaleString()} نقطة` : "انتظر حتى يكتمل";

    document.getElementById('spinBtn').disabled = data.points < 50;
    document.getElementById('xoBtn').disabled = data.points < 50;

    if(now - data.lastTaskReset > 24*60*60*1000 || data.dailyTasks.length === 0) {
        let shuffled = [...allTasks].sort(() => 0.5 - Math.random());
        data.dailyTasks = shuffled.slice(0, 3).map(t => ({...t, done: 0}));
        data.lastTaskReset = now;
    }

    data.dailyTasks.forEach(task => {
        if(!task.done){
            if(task.id === 'collect3' && data.stats.collects >= 3) task.done = 1;
            if(task.id === 'spend1000' && data.stats.spent >= 1000) task.done = 1;
            if(task.id === 'spin1' && data.stats.spins >= 1) task.done = 1;
            if(task.id === 'playxo' && data.stats.xoGames >= 1) task.done = 1;
            if(task.id === 'reach5k' && data.points >= 5000) task.done = 1;
        }
    });

    let tasksHTML = '';
    data.dailyTasks.forEach(task => {
        tasksHTML += `<div class="task-item"><span>${task.text}</span><button onclick="claimTask('${task.id}')" ${task.done?'disabled':''}>${task.done?'تم':'+task.reward}</button></div>`;
    });
    document.getElementById('tasks').innerHTML = tasksHTML;

    let shopHTML = "";
    shopItems.forEach(item => {
        let canBuy = data.points >= item.price;
        shopHTML += `<div class="shop-item"><div><b>${item.name}</b><br>السعر: ${item.price.toLocaleString()} نقطة</div><button onclick="buy(${item.level})" ${!canBuy? 'disabled' : ''}>شراء</button></div>`;
    });
    document.getElementById('shop').innerHTML = shopHTML;
}

function collect() {
    data.points += data.rate;
    data.lastCollect = Date.now();
    data.stats.collects++;
    save(); updateUI();
    document.getElementById('cashSound').play(); flyMoney();
    if(navigator.vibrate) navigator.vibrate(100);
}

function buy(level) {
    let item = shopItems.find(i => i.level === level);
    if(data.points >= item.price) {
        data.points -= item.price;
        data.stats.spent += item.price;
        data.level = level;
        data.rate = item.rate;
        save(); updateUI();
        alert(`تم شراء ${item.name} بنجاح!`);
    }
}

function spinWheel() {
    if(data.points < 50) {alert("تحتاج 50 نقطة"); return;}
    data.points -= 50;
    data.stats.spins++;
    let prize = wheelPrizes[Math.floor(Math.random()*wheelPrizes.length)];
    let deg = 360*5 + Math.random()*360;
    document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;
    setTimeout(()=>{
        data.points += prize; save(); updateUI();
        alert(`مبروك! ربحت ${prize.toLocaleString()} نقطة`);
    }, 4000);
}

function startXO() {
    if(data.points < 50) {alert("تحتاج 50 نقطة"); return;}
    data.points -= 50;
    data.stats.xoGames++;
    save(); updateUI();
    board = Array(9).fill(''); xoGameOver = false;
    renderBoard(); showPage('xo');
}

function renderBoard() {
    let html = ''; board.forEach((cell, i) => {
        html += `<div class="cell" onclick="makeMove(${i})">${cell}</div>`;
    });
    document.getElementById('board').innerHTML = html;
}

function makeMove(i) {
    if(board[i] || xoGameOver) return;
    board[i] = 'X'; renderBoard();
    if(checkWinner('X')) {endGame('win'); return;}
    if(board.every(c => c)) {endGame('draw'); return;}
    document.getElementById('xoStatus').innerText = "دور الذكاء الاصطناعي O";
    setTimeout(aiMove, 500);
}

function aiMove() {
    let empty = board.map((v,i) => v===''?i:null).filter(v=>v!==null);
    let move = empty[Math.floor(Math.random()*empty.length)];
    board[move] = 'O'; renderBoard();
    if(checkWinner('O')) {endGame('lose'); return;}
    if(board.every(c => c)) {endGame('draw'); return;}
    document.getElementById('xoStatus').innerText = "دورك X";
}

function checkWinner(p) {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return wins.some(combo => combo.every(i => board[i]===p));
}

function endGame(result) {
    xoGameOver = true;
    let prizes = [50, 100, 200, 500, 1000, 2000, 5000];
    if(result === 'win') {
        let prize = prizes[Math.floor(Math.random()*prizes.length)];
        data.points += prize; save(); updateUI();
        document.getElementById('xoStatus').innerText = `فزت! ربحت ${prize.toLocaleString()} نقطة`;
    } else {
        document.getElementById('xoStatus').innerText = result==='draw'? "تعادل! خسرت 50 نقطة" : "خسرت! خسرت 50 نقطة";
    }
}

function claimTask(id) {
    let task = data.dailyTasks.find(t => t.id === id);
    if(!task || task.done) return;
    data.points += task.reward;
    task.done = 1;
    save();
    updateUI();
}

function withdraw() {
    if(data.points < 100000) {alert("تحتاج 100000 نقطة"); return;}
    let info = document.getElementById('withdrawInfo').value;
    if(!info) {alert("دخل معلومات السحب"); return;}
    alert(`تم ارسال طلب السحب: ${info}`);
}

function useRef() {
    let code = document.getElementById('enterRef').value;
    if(data.referredBy) {alert("استخدمت رمز من قبل"); return;}
    if(code && code!= data.refCode) {
        data.referredBy = code; data.points += 500; save(); updateUI();
        alert(`تم تفعيل الرمز! حصلت 500 نقطة`);
    }
}

function copyRef() {navigator.clipboard.writeText(data.refCode); alert("تم نسخ الرمز: " + data.refCode);}

setInterval(updateUI, 1000); updateUI();
</script>
</body>
</html>
