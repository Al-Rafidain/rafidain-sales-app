    async function createAccount(){
  let name=document.getElementById('regName').value.trim();
  let email=document.getElementById('regEmail').value.trim();
  let pass=document.getElementById('regPass').value;
  if(!name||!email||!pass)return document.getElementById('authMsg').innerText="املا كل الحقول";
  try{
    let cred=await createUserWithEmailAndPassword(auth,email,pass);
    await sendEmailVerification(cred.user);
    myReferralCode=Math.random().toString(36).substr(2,8).toUpperCase();
    await setDoc(doc(db,"users",cred.user.uid),{name,email,coins:1000,counters:[],dailyProfitTotal:0,referral:myReferralCode,referredBy:'',totalGiftsSent:0,friends:[],requests:[]});
    document.getElementById('authMsg').innerText="تم انشاء الحساب. افحص ايميلك للتفعيل";
  }catch(e){document.getElementById('authMsg').innerText=e.message;}
}

async function loginAccount(){
  let email=document.getElementById('regEmail').value.trim();
  let pass=document.getElementById('regPass').value;
  try{
    let cred=await signInWithEmailAndPassword(auth,email,pass);
    if(!cred.user.emailVerified)return document.getElementById('authMsg').innerText="فعل ايميلك اولا";
  }catch(e){document.getElementById('authMsg').innerText=e.message;}
}

async function resetPassword(){
  let email=document.getElementById('regEmail').value.trim();
  if(!email)return alert("دخل الايميل");
  await sendPasswordResetEmail(auth,email);alert("تم ارسال رابط اعادة التعيين");
}
    onAuthStateChanged(auth,async(user)=>{
  if(user){
    currentUser=user.uid;
    let snap=await getDoc(doc(db,"users",currentUser));
    if(snap.exists()){
      let data=snap.data();
      userName=data.name;coins=data.coins;counters=data.counters||[];dailyProfitTotal=data.dailyProfitTotal||0;myReferralCode=data.referral;streak=data.streak||0;
    }
    document.getElementById('authPage').classList.remove('active');
    document.getElementById('homePage').classList.add('active');
    updateAll();checkProfit();setInterval(checkProfit,60000);
  }
});

async function saveUserData(){
  await setDoc(doc(db,"users",currentUser),{name:userName,coins,counters,dailyProfitTotal,referral:myReferralCode,streak,lastStreakClaim},{merge:true});
}

function updateAll(){
  document.getElementById('coinsDisplay').innerText=coins.toLocaleString();
  document.getElementById('userNameDisplay').innerText=userName;
  document.getElementById('streakDisplay').innerText=streak;
}
    async function checkProfit(){
  if(counters.length>0){
    let profit=Math.floor(dailyProfitTotal/1440);
    if(profit>0){coins+=profit;addLog('ربح تلقائي',profit,'win');await saveUserData();updateAll();}
  }
}

function addLog(desc,amount,type){logData.unshift({desc,amount,type,time:new Date().toLocaleString()});if(logData.length>50)logData.pop();}

function loadLog(){let html='';logData.forEach(l=>{html+=`<div class="msg">${l.time} - ${l.desc} ${l.amount>0?'+':''}${l.amount}</div>`});document.getElementById('logList').innerHTML=html;}

function claimStreak(){
  let today=new Date().toDateString();
  if(lastStreakClaim==today)return alert("استلمت مكافأتك اليوم");
  streak++;let reward=streak*100;coins+=reward;lastStreakClaim=today;
  showToast(`+${reward} نقطة - يوم ${streak}`);
  saveUserData();updateAll();
}

function showToast(msg){let t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
    function loadStore(){let html='';countersData.forEach(c=>{html+=`<div class="counterItem"><h4>${c.name}</h4><p>السعر: ${c.price.toLocaleString()} نقطة</p><p>الربح: ${c.profit.toLocaleString()} كل 24س</p><button class="btn" onclick="buyCounter(${c.price},${c.profit},'${c.name}')" ${coins<c.price?'disabled':''}>شراء</button></div>`});document.getElementById('storeList').innerHTML=html;}

async function buyCounter(price,profit,name){
  if(coins<price)return alert("ليس لديك نقاط");
  coins-=price;dailyProfitTotal+=profit;addLog(`شراء ${name}`,-price,'buy');if(!dailyTasks.buy.done)completeTask('buy');
  await saveUserData();updateAll();loadStore();alert("تم الشراء");
}

function setupReferral(){document.getElementById('myReferralCode').innerText=myReferralCode;}
function copyCode(){navigator.clipboard.writeText(`كودي: ${myReferralCode}`);alert("تم النسخ");}

async function transferCoins(){
  let ref=document.getElementById('transferRefInput').value.trim();
  let amount=parseInt(document.getElementById('transferAmountInput').value);
  if(!ref||!amount||amount<=0)return alert("خطا");
  if(coins<amount)return alert("رصيدك لا يكفي");
  let q=query(collection(db,"users"),where("referral","==",ref));let snap=await getDocs(q);
  if(snap.empty)return alert("الكود غير صحيح");
  let targetId=snap.docs[0].id;let targetData=snap.docs[0].data();
  coins-=amount;
  await updateDoc(doc(db,"users",targetId),{coins:targetData.coins+amount});
  addLog(`تحويل ${amount}`,-amount,'buy');await saveUserData();updateAll();
  alert("تم التحويل");
    }
    function checkTaskReset(){
  let now=new Date().toDateString();
  if(lastTaskReset!=now){
    dailyTasks={login:{done:false,reward:200},buy:{done:false,reward:300},play:{done:false,reward:150}};
    lastTaskReset=now;
  }
}

function loadTasks(){
  checkTaskReset();
  let html='';
  html+=`<div class="counterItem"><h4>تسجيل الدخول</h4><p>المكافأة: ${dailyTasks.login.reward}</p><button class="btn" onclick="completeTask('login')" ${dailyTasks.login.done?'disabled':''}>${dailyTasks.login.done?'تم':'استلام'}</button></div>`;
  html+=`<div class="counterItem"><h4>شراء عداد</h4><p>المكافأة: ${dailyTasks.buy.reward}</p><button class="btn" onclick="completeTask('buy')" ${dailyTasks.buy.done?'disabled':''}>${dailyTasks.buy.done?'تم':'استلام'}</button></div>`;
  html+=`<div class="counterItem"><h4>لعب لعبة</h4><p>المكافأة: ${dailyTasks.play.reward}</p><button class="btn" onclick="completeTask('play')" ${dailyTasks.play.done?'disabled':''}>${dailyTasks.play.done?'تم':'استلام'}</button></div>`;
  document.getElementById('dailyTasks').innerHTML=html;
}

async function completeTask(task){
  if(dailyTasks[task].done)return;
  coins+=dailyTasks[task].reward;addLog(`مهمة ${task}`,dailyTasks[task].reward,'win');
  dailyTasks[task].done=true;await saveUserData();showToast(`+${dailyTasks[task].reward}`);updateAll();loadTasks();
}

  let q=query(collection(db,"users"),orderBy(type=='gifts'?'totalGiftsSent':'coins','desc'),limit(20));

  document.getElementById('leaderboardList').innerHTML=html;

    function getDots(n){const p={0:[],1:[[50,50]],2:[[25,25],[75,75]],3:[[25,25],[50,50],[75,75]],4:[[25,25],[75,25],[25,75],[75,75]],5:[[25,25],[75,25],[50,50],[25,75],[75,75]],6:[[25,20],[75,20],[25,50],[75,50],[25,80],[75,80]]};return p[n]||[];}
function renderDots(n){return getDots(n).map(d=>`<div class="dot" style="left:${d[0]}%;top:${d[1]}%"></div>`).join('');}
function createDominoSet(){dominoSet=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)dominoSet.push([i,j]);}

function openDomino(){
  if(coins<50)return alert("ليس لديك 50");
  coins-=50;addLog('لعب دومينو',-50,'buy');if(!dailyTasks.play.done)completeTask('play');updateAll();
  createDominoSet();dominoSet.sort(()=>.5-Math.random());dominoMy=dominoSet.splice(0,7);dominoBot=dominoSet.splice(0,7);
  let first=dominoSet.pop();dominoTable=[first];dominoLeftEnd=first[0];dominoRightEnd=first[1];
  document.getElementById('dominoModal').style.display='flex';document.getElementById('dominoResult').innerText='';renderDomino();
}
function renderTile(tile,hidden=false){if(hidden)return'<div class="dominoTile"><div class="dominoHalf top"></div><div class="dominoHalf"></div></div>';return`<div class="dominoTile"><div class="dominoHalf top">${renderDots(tile[0])}</div><div class="dominoHalf">${renderDots(tile[1])}</div></div>`;}
function renderDomino(){document.getElementById('botTiles').innerHTML=dominoBot.map(_=>renderTile([0,0],true)).join('');document.getElementById('dominoTable').innerHTML=dominoTable.map(t=>renderTile(t)).join('');document.getElementById('myTiles').innerHTML=dominoMy.map((t,i)=>`<div class="dominoTile" onclick="playDomino(${i})"><div class="dominoHalf top">${renderDots(t[0])}</div><div class="dominoHalf">${renderDots(t[1])}</div></div>`).join('');}
function canPlayLeft(tile){return tile[0]==dominoLeftEnd||tile[1]==dominoLeftEnd;}
function canPlayRight(tile){return tile[0]==dominoRightEnd||tile[1]==dominoRightEnd;}
function playDomino(i){let tile=[...dominoMy[i]];if(canPlayRight(tile)){if(tile[0]!=dominoRightEnd)tile=[tile[1],tile[0]];dominoTable.push(tile);dominoRightEnd=tile[1];}else if(canPlayLeft(tile)){if(tile[1]!=dominoLeftEnd)tile=[tile[1],tile[0]];dominoTable.unshift(tile);dominoLeftEnd=tile[0];}else{return;}dominoMy.splice(i,1);renderDomino();checkDominoWin();}
async function checkDominoWin(){if(dominoMy.length==0){coins+=250;addLog('فوز دومينو',250,'win');document.getElementById('dominoResult').innerText='فزت! +250';await saveUserData();updateAll();}}

function openMemory(){
  if(coins<50)return alert("ليس لديك 50");
  coins-=50;addLog('لعب ميموري',-50,'buy');if(!dailyTasks.play.done)completeTask('play');updateAll();
  document.getElementById('memoryModal').style.display='flex';startMemory();
}
function startMemory(){matched=0;flipped=[];let emojis=['💎','💰','🏛️','⚡','💎','💰','🏛️','⚡'];memoryCards=emojis.sort(()=>.5-Math.random());let board=document.getElementById('memoryBoard');board.innerHTML='';memoryCards.forEach((card,i)=>{let div=document.createElement('div');div.style.cssText='width:60px;height:60px;background:#3b82f6;border-radius:10px;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff';div.dataset.index=i;div.dataset.value=card;div.innerText='?';div.onclick=()=>flipCard(div);board.appendChild(div);});}
async function flipCard(el){if(flipped.length==2||el.innerText!='?')return;el.innerText=el.dataset.value;flipped.push(el);if(flipped.length==2){setTimeout(async()=>{if(flipped[0].dataset.value==flipped[1].dataset.value){flipped.forEach(c=>c.style.background='#0f0');matched++;if(matched==4){coins+=250;addLog('فوز ميموري',250,'win');document.getElementById('memoryResult').innerText='فزت! +250';await saveUserData();updateAll();}}else{flipped.forEach(c=>c.innerText='?');}flipped=[];},800);}}

function openXO(){
  if(coins<50)return alert("ليس لديك 50");
  coins-=50;addLog('لعب XO',-50,'buy');if(!dailyTasks.play.done)completeTask('play');updateAll();
  xoBoard=Array(9).fill('');gameOver=false;document.getElementById('xoModal').style.display='flex';document.getElementById('xoResult').innerText='';renderXO();
}
function renderXO(){let b=document.getElementById('xoBoard');b.innerHTML='';xoBoard.forEach((cell,i)=>{let div=document.createElement('div');div.className='xoCell';div.innerText=cell;div.onclick=()=>playXO(i);b.appendChild(div);});}
async function playXO(i){if(xoBoard[i]!=''||gameOver)return;xoBoard[i]='X';if(checkWinner('X')){coins+=200;addLog('فوز XO',200,'win');document.getElementById('xoResult').innerText="فزت! +200";gameOver=true;await saveUserData();updateAll();renderXO();return;}if(!xoBoard.includes('')){document.getElementById('xoResult').innerText="تعادل";gameOver=true;renderXO();return;}botMove();}
function botMove(){let empty=xoBoard.map((v,i)=>v==''?i:null).filter(v=>v!==null);let move=empty[Math.floor(Math.random()*empty.length)];xoBoard[move]='O';if(checkWinner('O')){document.getElementById('xoResult').innerText="خسرت!";gameOver=true;}else if(!xoBoard.includes('')){document.getElementById('xoResult').innerText="تعادل";gameOver=true;}renderXO();}
function checkWinner(p){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return wins.some(w=>w.every(i=>xoBoard[i]==p));}
    function spinWheel(){
    if(coins<50)return alert("ليس لديك 50 نقطة");
    coins-=50;addLog('لف العجلة',-50,'buy');if(!dailyTasks.play.done)completeTask('play');updateAll();
    document.getElementById('wheelModal').style.display='flex';document.getElementById('wheelResult').innerText='';drawWheel();
  }

  function drawWheel(){
    const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
    const centerX=140,centerY=140,radius=130,segmentAngle=2*Math.PI/wheelPrizes.length;
    ctx.clearRect(0,0,280,280);
    wheelPrizes.forEach((p,i)=>{
      const startAngle=i*segmentAngle-Math.PI/2,endAngle=(i+1)*segmentAngle-Math.PI/2;
      ctx.beginPath();ctx.moveTo(centerX,centerY);ctx.arc(centerX,centerY,radius,startAngle,endAngle);
      ctx.fillStyle=i%2==0?'#3b82f6':'#1e3a8a';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.save();ctx.translate(centerX,centerY);ctx.rotate(startAngle+segmentAngle/2);
      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 14px tahoma';ctx.fillText(p.text,radius-30,5);ctx.restore();
    });
  }

  async function doSpin(){
    document.getElementById('spinBtn').disabled=true;
    let randomIndex=Math.floor(Math.random()*wheelPrizes.length),segmentDeg=360/wheelPrizes.length;
    let targetAngle=360-(segmentDeg*randomIndex+segmentDeg/2);let targetDeg=3600+targetAngle;
    document.getElementById('wheel').style.transform=`rotate(${targetDeg}deg)`;
    document.getElementById('wheel').style.transition='transform 5s cubic-bezier(0.17, 0.67, 0.12, 1)';
    setTimeout(async()=>{
      let prize=wheelPrizes[randomIndex];
      if(prize.value>0){coins+=prize.value;addLog('ربح من العجلة',prize.value,'win');}
      document.getElementById('wheelResult').innerText=prize.value>0?`ربحت ${prize.text} نقطة`:`حظ اوفر`;
      await saveUserData();updateAll();document.getElementById('spinBtn').disabled=false;
    },5000);
  }

  function openBox(){
    if(coins<500)return alert("ليس لديك 500 نقطة");
    coins-=500;addLog('فتح صندوق',-500,'buy');if(!dailyTasks.play.done)completeTask('play');updateAll();
    boxOpened=false;document.getElementById('boxModal').style.display='flex';document.getElementById('boxResult').innerText='اختار صندوق!';
    let boxes=document.getElementById('boxes');boxes.innerHTML='';
    let winningBox=Math.floor(Math.random()*3),prize=Math.floor(Math.random()*9901)+100;
    for(let i=0;i<3;i++){
      let div=document.createElement('div');
      div.className='boxItem';div.innerText='📦';div.dataset.isWinner=i==winningBox;div.dataset.prize=prize;div.onclick=()=>openMysteryBox(div);boxes.appendChild(div);
    }
  }

  async function openMysteryBox(el){
    if(boxOpened)return;boxOpened=true;
    let isWinner=el.dataset.isWinner=='true',prize=parseInt(el.dataset.prize);
    document.querySelectorAll('.boxItem').forEach(b=>{
      if(b.dataset.isWinner=='true'){b.style.background='#0f0';b.innerText=b.dataset.prize;}
      else{b.style.background='#f00';b.innerText='💀';}
    });
    if(isWinner){coins+=prize;addLog('ربح من الصندوق',prize,'win');document.getElementById('boxResult').innerText=`مبروك! ربحت ${prize.toLocaleString()} نقطة`;}
    else{document.getElementById('boxResult').innerText=`حظ اوفر! الصندوق الفارغ`;}
    await saveUserData();updateAll();
      }
    function openLudo(){
    if(coins<100)return alert("ليس لديك 100 نقطة");
    coins-=100;addLog('لعب لودو',-100,'buy');if(!dailyTasks.play.done)completeTask('play');updateAll();
    document.getElementById('ludoModal').style.display='flex';
    ludoPlayers.forEach(p=>{p.pieces=[0,0,0,0];p.home=0;});
    ludoCurrentPlayer=0;ludoDice=1;ludoCanMove=false;
    document.getElementById('ludoTurn').innerText=`دور: ${ludoPlayers[0].name}`;
    renderLudoBoard();startLudoBots();
  }

  function renderLudoBoard(){
    let board=document.getElementById('ludoBoard');board.innerHTML='';
    for(let y=0;y<15;y++){
      for(let x=0;x<15;x++){
        let cell=document.createElement('div');cell.className='ludoCell';cell.id=`cell-${x}-${y}`;
        cell.style.background='#1a1f3a';
        // تلوين البدايات والبيوت
        if((x<6&&y<6)||(x>8&&y<6)||(x<6&&y>8)||(x>8&&y>8))cell.style.background='#222';
        if(x==6&&y<6)cell.style.background='#0f0'; // اخضر
        if(x>8&&y==6)cell.style.background='#f00'; // احمر
        if(x==6&&y>8)cell.style.background='#00f'; // ازرق
        if(x<6&&y==6)cell.style.background='#ff0'; // اصفر
        board.appendChild(cell);
      }
    }
    // رسم القطع
    ludoPlayers.forEach((player,pid)=>{
      player.pieces.forEach((pos,pieceId)=>{
        if(pos==0){
          let start=START_POSITIONS[pid];
          let cell=document.getElementById(`cell-${start.x+pieceId%2}-${start.y+Math.floor(pieceId/2)}`);
          if(cell)cell.innerHTML=`<div style="width:100%;height:100%;background:${player.color};border-radius:50%"></div>`;
        }else if(pos>0&&pos<=52){
          let pathPos=(pos + pid*13)%52;
          let coord=LUDO_MAIN_PATH[pathPos];
          let cell=document.getElementById(`cell-${coord.x}-${coord.y}`);
          if(cell)cell.innerHTML=`<div style="width:100%;height:100%;background:${player.color};border-radius:50%"></div>`;
        }else if(pos>52){
          let homeStep=pos-53;
          let coord=HOME_PATHS[pid][homeStep];
          let cell=document.getElementById(`cell-${coord.x}-${coord.y}`);
          if(cell)cell.innerHTML=`<div style="width:100%;height:100%;background:${player.color};border-radius:50%"></div>`;
        }
      });
    });
  }

  function rollDice(){
    ludoDice=Math.floor(Math.random()*6)+1;
    document.getElementById('diceValue').innerText=ludoDice;
    ludoCanMove=true;
    if(ludoCurrentPlayer==0){
      // دور اللاعب
      let canMove=checkCanMove(0);
      if(!canMove)nextLudoTurn();
    }else{
      // دور البوت
      setTimeout(botLudoMove,1000);
    }
  }

  function checkCanMove(pid){
    let player=ludoPlayers[pid];
    for(let i=0;i<4;i++){
      let pos=player.pieces[i];
      if(pos==0&&ludoDice==6)return true;
      if(pos>0&&pos<59)return true;
    }
    return false;
  }

  function movePiece(pid,pieceId){
    if(pid!=ludoCurrentPlayer||!ludoCanMove)return;
    let player=ludoPlayers[pid];
    let pos=player.pieces[pieceId];
    if(pos==0&&ludoDice==6){
      player.pieces[pieceId]=1;
    }else if(pos>0){
      player.pieces[pieceId]+=ludoDice;
      if(player.pieces[pieceId]>59)player.pieces[pieceId]=59;
      if(player.pieces[pieceId]==59)player.home++;
    }
    ludoCanMove=false;
    renderLudoBoard();checkLudoWin();
    if(ludoDice!=6)nextLudoTurn();else document.getElementById('ludoTurn').innerText=`دورك مرة ثانية`;
  }

  function nextLudoTurn(){
    ludoCurrentPlayer=(ludoCurrentPlayer+1)%4;
    document.getElementById('ludoTurn').innerText=`دور: ${ludoPlayers[ludoCurrentPlayer].name}`;
    if(ludoCurrentPlayer!=0){
      setTimeout(botLudoMove,1000);
    }
  }

  function botLudoMove(){
    if(ludoCurrentPlayer==0)return;
    let player=ludoPlayers[ludoCurrentPlayer];
    rollDice();
    // البوت الغبي: يحرك اول قطعة يكدر
    for(let i=0;i<4;i++){
      let pos=player.pieces[i];
      if(pos==0&&ludoDice==6){movePiece(ludoCurrentPlayer,i);return;}
      if(pos>0&&pos<59){movePiece(ludoCurrentPlayer,i);return;}
    }
    nextLudoTurn();
  }

  function startLudoBots(){
    if(ludoCurrentPlayer!=0)botLudoMove();
  }

  async function checkLudoWin(){
    for(let p of ludoPlayers){
      if(p.home==4){
        if(p.id==0){
          coins+=1000;addLog('فوز لودو',1000,'win');
          alert('مبروك فزت باللودو! +1000 نقطة');
        }else{
          alert(`خسرت! فاز ${p.name}`);
        }
        await saveUserData();updateAll();
        document.getElementById('ludoModal').style.display='none';
        return;
      }
    }
  }

  // ربط النقر على القطع
  document.addEventListener('click',function(e){
    if(e.target.closest('#ludoBoard')){
      let cell=e.target.closest('.ludoCell');
      if(cell&&ludoCurrentPlayer==0){
        // نبحث عن القطعة اللي اننقرت
        ludoPlayers[0].pieces.forEach((pos,i)=>{
          if(pos>0&&pos<=52){
            let pathPos=(pos + 0*13)%52;
            let coord=LUDO_MAIN_PATH[pathPos];
            if(cell.id==`cell-${coord.x}-${coord.y}`)movePiece(0,i);
          }
        });
      }
    }
  });

    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

    if(id=='store')loadStore();if(id=='games')loadTasks();if(id=='referral')setupReferral();

    if(id=='friends')loadFriendsPage();if(id=='leaderboard')loadLeaderboard('coins');
  }

  window.rejectFriendRequest=rejectFriendRequest;window.removeFriend=removeFriend;window.openPrivateChat=openPrivateChat;
  window.sendPrivateMsg=sendPrivateMsg;window.transferCoins=transferCoins;window.buyCounter=buyCounter;window.copyCode=copyCode;
  window.completeTask=completeTask;window.openDomino=openDomino;window.playDomino=playDomino;window.openMemory=openMemory;
  window.openXO=openXO;window.spinWheel=spinWheel;window.doSpin=doSpin;window.openBox=openBox;window.openLudo=openLudo;
  window.rollDice=rollDice;window.openCreateRoom=openCreateRoom;window.createRoom=createRoom;window.joinRoomById=joinRoomById;
  window.enterRoom=enterRoom;window.toggleMicOwner=toggleMicOwner;window.sendRoomMsg=sendRoomMsg;window.clearRoomChat=clearRoomChat;
