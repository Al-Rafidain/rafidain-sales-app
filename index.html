<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>تطبيق الرافدين - الألعاب والغرف الصوتية</title>
<style>
*{box-sizing:border-box}
body{background:#000;color:#fff;font-family:tahoma,sans-serif;text-align:center;padding:10px;margin:0;padding-bottom:100px}
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a1a3a 0%,#000 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.5s, visibility 0.5s}
.logo{font-size:50px;margin:15px}
h1{color:#3b82f6;text-shadow:0 0 15px #3b82f6;font-size:26px}
.page{display:none}.page.active{display:block}
.stats{margin:15px auto;max-width:420px}
.box{border:3px solid #3b82f6;border-radius:18px;padding:20px;margin:15px 0;background:#111}
.box h3{margin:5px;font-size:16px;color:#aaa}
#coins{font-size:36px;color:#0f0;font-weight:bold;margin:10px 0}
#coinsDollar{font-size:18px;color:#3b82f6;font-weight:bold}
.btn{background:#3b82f6;color:#fff;border:0;padding:16px;border-radius:15px;font-size:16px;font-weight:bold;margin:10px auto;cursor:pointer;width:90%;max-width:380px;display:block;transition:0.2s}
.btn:active{transform:scale(.95)}
.btn-green{background:#0f0;color:#000;width:100%;padding:18px;font-size:18px}
.btn-blue{background:#3b82f6}
.btn-red{background:#f33;color:#fff}
.btn-yellow{background:#ffb300;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000;overflow-y:auto}
.modal-content{background:#1a1a1a;margin:20px auto;padding:15px;width:95%;max-width:500px;border-radius:15px;border:2px solid #3b82f6}
.input{width:90%;padding:12px;margin:8px 0;border-radius:8px;background:#222;color:#fff;border:1px solid #3b82f6;font-size:16px}
.bottomNav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:95%;max-width:500px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);border-radius:25px;display:flex;justify-content:space-around;padding:10px 5px;z-index:999}
.navItem{display:flex;flex-direction:column;align-items:center;color:#ddd;font-size:10px;cursor:pointer;flex:1}
.navIcon{font-size:20px;margin-bottom:2px}
.navItem.active{color:#fff;font-weight:bold}
.roomItem{background:#222;padding:15px;margin:10px 0;border-radius:12px;border:2px solid #3b82f6;text-align:right;display:flex;justify-content:space-between;align-items:center}
.chatBox{height:200px;overflow-y:auto;background:#0a0a0a;border:2px solid #3b82f6;border-radius:15px;padding:10px;margin-bottom:10px;text-align:right}
.chatMsg{margin:8px 0;padding:8px 12px;border-radius:10px;max-width:85%;word-wrap:break-word}
.chatMsg.me{background:#3b82f6;margin-right:auto;text-align:left;color:#fff}
.chatMsg.other{background:#222;margin-left:auto;color:#fff}
.mic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.mic-slot{background:#111;border:2px dashed #3b82f6;border-radius:12px;padding:15px 5px;text-align:center;cursor:pointer;position:relative}
.mic-slot.active{border-style:solid;border-color:#0f0;background:#052e16}
.mic-icon{font-size:24px;margin-bottom:5px}
.mic-name{font-size:11px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div id="splash"><div class="logo">🏛️</div><h1>AL-RAFIDAIN</h1></div>

<div id="registerPage" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9998;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px">
  <div class="logo">🏛️</div>
  <h1>تسجيل الدخول لتطبيق الرافدين</h1>
  <div class="box" style="max-width:400px;width:100%">
    <input type="text" id="regName" class="input" placeholder="ادخل اسمك المستعار">
    <button class="btn btn-green" onclick="createAccount()">دخول التطبيق</button>
  </div>
</div>

<div id="mainApp" style="display:none">
  <div class="logo">🏛️</div>
  <h1>تطبيق الرافدين</h1>

  <!-- صفحة الألعاب والرصيد -->
  <div id="home" class="page active">
    <div class="stats box">
      <h3>رصيد الكوينز</h3>
      <div id="coins">0</div>
      <div id="coinsDollar">($0.00)</div>
    </div>
    <button class="btn btn-green" onclick="openGameModal()">🎮 قسم الألعاب وحظك نصيبك</button>
  </div>

  <!-- صفحة الغرف الصوتية -->
  <div id="rooms" class="page">
    <h2>🏠 غرف البث الصوتي والمايكات</h2>
    <button class="btn btn-green" onclick="openCreateRoom()">➕ انشاء غرفة جديدة</button>
    <div id="roomsList" style="margin-top:15px"></div>
  </div>

  <!-- صفحة تفاصيل الغرفة الصوتية -->
  <div id="chatRoom" class="page">
    <button class="btn" onclick="showPage('rooms',null)">🔙 خروج من الغرفة</button>
    <h2 id="roomNameTitle"></h2>
    
    <div class="box" style="background:#0a0a0a;">
      <h3 style="color:#0f0;">🎙️ مقاعد التحدث الصوتي</h3>
      <div class="mic-grid" id="micGrid"></div>
      <button class="btn btn-yellow" id="toggleMicBtn" onclick="toggleMyMic()">🎤 فتح المايك للتحدث</button>
    </div>

    <div id="roomChatBox" class="chatBox"></div>
    <div style="display:flex;gap:8px;justify-content:center;max-width:400px;margin:auto">
      <input type="text" id="roomChatInput" class="input" placeholder="اكتب رسالة نصية..." style="width:70%">
      <button class="btn" style="width:25%;margin:8px 0" onclick="sendRoomMsg()">إرسال</button>
    </div>
  </div>

  <!-- نافذة الألعاب -->
  <div id="gameModal" class="modal">
    <div class="modal-content">
      <h2>🎲 الألعاب الترفيهية</h2>
      <button class="btn btn-yellow" onclick="playLuckyBox()">🎁 صندوق حظك نصيبك</button>
      <button class="btn btn-red" onclick="closeGameModal()">إغلاق</button>
    </div>
  </div>

  <div class="bottomNav">
    <div class="navItem active" onclick="showPage('home',this)"><div class="navIcon">🎮</div><div>الرئيسية</div></div>
    <div class="navItem" onclick="showPage('rooms',this)"><div class="navIcon">🎙️</div><div>الغرف</div></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbkpcBPq8G2OpyKxaVqPO7Mkfla4X9hxU",
  authDomain: "rafidainapp.firebaseapp.com",
  projectId: "rafidainapp",
  storageBucket: "rafidainapp.firebasestorage.app",
  messagingSenderId: "512875147812",
  appId: "1:512875147812:web:54f33bda3780db7a4a9eb1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = '', currentRoom = null, coins = 100000;

setTimeout(()=>{
  document.getElementById('splash').style.opacity = '0';
  document.getElementById('splash').style.visibility = 'hidden';
  checkLogin();
}, 1000);

function checkLogin(){
  currentUser = localStorage.getItem('rafidain_user');
  if(currentUser){
    document.getElementById('registerPage').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    loadUserData();
    listenToRooms();
  }
}

window.createAccount = async function(){
  let name = document.getElementById('regName').value.trim();
  if(!name) return alert("يرجى إدخال الاسم");
  currentUser = name;
  localStorage.setItem('rafidain_user', name);
  const userRef = doc(db, "users", name);
  let snap = await getDoc(userRef);
  if(!snap.exists()){
    await setDoc(userRef, { name: name, coins: 100000 });
  }
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  loadUserData();
  listenToRooms();
}

async function loadUserData(){
  const userRef = doc(db, "users", currentUser);
  let snap = await getDoc(userRef);
  if(snap.exists()){
    coins = snap.data().coins || 100000;
    updateUI();
  }
}

function updateUI(){
  document.getElementById('coins').innerText = coins.toLocaleString();
  document.getElementById('coinsDollar').innerText = '$' + (coins / 10000).toFixed(2);
}

window.showPage = function(id, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.navItem').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  if(id == 'rooms') leaveRoomCleanUp();
}

window.openGameModal = function(){ document.getElementById('gameModal').style.display = 'block'; }
window.closeGameModal = function(){ document.getElementById('gameModal').style.display = 'none'; }

window.playLuckyBox = async function(){
  let reward = Math.floor(Math.random() * 5000) + 1000;
  coins += reward;
  updateUI();
  await updateDoc(doc(db, "users", currentUser), { coins: coins });
  alert("🎉 مبروك! ربحت " + reward.toLocaleString() + " كوينز من صندوق حظك نصيبك!");
  closeGameModal();
}

window.openCreateRoom = async function(){
  let name = prompt("ادخل اسم الغرفة الصوتية:");
  if(!name) return;
  let id = 'RM' + Math.floor(Math.random()*900000+100000);
  let initialMics = Array(8).fill({ user: null });
  await setDoc(doc(db, "rooms", id), { id, name, owner: currentUser, mics: initialMics });
  enterRoom(id);
}

function listenToRooms(){
  onSnapshot(collection(db, "rooms"), (snapshot) => {
    let html = '';
    snapshot.forEach((d) => {
      let r = d.data();
      html += `<div class="roomItem" onclick="enterRoom('${r.id}')"><div><h4>🎙️ ${r.name}</h4><small style="color:#aaa">المالك: ${r.owner}</small></div><button class="btn btn-blue" style="width:auto;margin:0">دخول الغرفة</button></div>`;
    });
    document.getElementById('roomsList').innerHTML = html || '<p style="color:#aaa">لا توجد غرف متاحة حالياً</p>';
  });
}
let localStream = null;
let myMicIndex = -1;

window.enterRoom = function(id){
  onSnapshot(doc(db, "rooms", id), (docSnap) => {
    if(!docSnap.exists()) return;
    currentRoom = docSnap.data();
    document.getElementById('roomNameTitle').innerText = currentRoom.name;
    renderMics(currentRoom.mics || Array(8).fill({user:null}));
  });

  onSnapshot(doc(db, "roomMessages", id), (docSnap) => {
    let box = document.getElementById('roomChatBox');
    box.innerHTML = '';
    let msgs = docSnap.exists() ? (docSnap.data().messages || []) : [];
    msgs.forEach(m => {
      let cls = m.u === currentUser ? 'me' : 'other';
      box.innerHTML += `<div class="chatMsg ${cls}"><b>${m.u}:</b> ${m.t}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  });

  showPage('chatRoom', null);
}

function renderMics(mics){
  let grid = document.getElementById('micGrid');
  grid.innerHTML = '';
  mics.forEach((mic, index) => {
    let isActive = mic.user !== null;
    grid.innerHTML += `
      <div class="mic-slot ${isActive ? 'active' : ''}" onclick="occupyMic(${index})">
        <div class="mic-icon">${isActive ? '🎙️' : '🎧'}</div>
        <div class="mic-name">${mic.user || 'مايك ' + (index+1)}</div>
      </div>`;
  });
}

window.occupyMic = async function(index){
  if(!currentRoom) return;
  let mics = [...currentRoom.mics];
  
  if(mics[index].user === null){
    mics.forEach((m, i) => { if(m.user === currentUser) mics[i] = {user: null}; });
    mics[index] = { user: currentUser };
    myMicIndex = index;
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      document.getElementById('toggleMicBtn').innerText = '🔴 كتم الصوت (Mute)';
    } catch(e) {
      alert("يرجى السماح بالوصول للميكروفون من متصفحك");
      return;
    }
  } else if(mics[index].user === currentUser){
    mics[index] = { user: null };
    myMicIndex = -1;
    if(localStream) localStream.getTracks().forEach(track => track.stop());
    document.getElementById('toggleMicBtn').innerText = '🎤 فتح المايك للتحدث';
  } else {
    alert("هذا المايك مشغول حالياً!");
    return;
  }

  await updateDoc(doc(db, "rooms", currentRoom.id), { mics: mics });
}

window.toggleMyMic = function(){
  if(myMicIndex === -1){
    let emptyIdx = currentRoom.mics.findIndex(m => m.user === null);
    if(emptyIdx !== -1) occupyMic(emptyIdx);
    else alert("عذراً، جميع المايكات مشغولة حالياً!");
  } else {
    occupyMic(myMicIndex);
  }
}

window.sendRoomMsg = async function(){
  let txt = document.getElementById('roomChatInput').value.trim();
  if(!txt || !currentRoom) return;
  await setDoc(doc(db, "roomMessages", currentRoom.id), {
    messages: arrayUnion({ u: currentUser, t: txt, time: Date.now() })
  }, { merge: true });
  document.getElementById('roomChatInput').value = '';
}

function leaveRoomCleanUp(){
  if(localStream) localStream.getTracks().forEach(t => t.stop());
  if(currentRoom && myMicIndex !== -1){
    let mics = [...currentRoom.mics];
    mics[myMicIndex] = { user: null };
    updateDoc(doc(db, "rooms", currentRoom.id), { mics: mics }).catch(()=>{});
    myMicIndex = -1;
  }
}
</script>
</body>
</html>
