<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق الرافدين</title>
<style>
body{background:#000; color:white; font-family:tahoma; text-align:center; padding:10px; margin:0;}
.logo{font-size:40px; margin:10px;}
h1{color:#ffcc00; text-shadow:0 0 10px #ffcc00; font-size:24px; margin:10px;}
.nav{display:flex; justify-content:center; gap:10px; margin:15px 0;}
.navBtn{background:#222; color:white; border:2px solid #ff8c00; padding:10px 25px; border-radius:10px; font-size:16px; cursor:pointer;}
.navBtn.active{background:#ff8c00; color:#000; font-weight:bold;}
.page{display:none;}
.page.active{display:block;}
.stats{margin:20px auto; max-width:400px;}
.box{border:3px solid #00ff00; border-radius:15px; padding:15px; margin:15px 0; background:#111;}
.box h3{margin:5px; font-size:16px; color:#aaa;}
#coins{font-size:32px; color:#00ff00; font-weight:bold;}
#counterCount{font-size:32px; color:#ffb300; font-weight:bold;}
#perDay{font-size:24px; color:#00ccff; font-weight:bold;}
.btn{background:#ff8c00; color:#000; border:none; padding:15px; border-radius:12px; font-size:16px; font-weight:bold; margin:8px; cursor:pointer; width:90%; max-width:350px;}
.btn:disabled{background:#555; color:#999;}
.btn-half{width:45%; max-width:170px;}
.modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; overflow-y:auto;}
.modal-content{background:#1a1a1a; margin:20px auto; padding:15px; width:95%; max-width:500px; border-radius:15px; border:2px solid #ff8c00;}
.counterItem{background:#222; padding:15px; margin:10px auto; border-radius:10px; border:2px solid #333; width:90%; max-width:350px;}
.counterItem h4{color:#ffb300; margin:5px; font-size:18px;}
.counterItem p{margin:5px; color:#aaa;}
#xoBoard{display:grid; grid-template-columns:repeat(3,100px); gap:5px; margin:20px auto; width:310px;}
.xoCell{width:100px; height:100px; background:#222; font-size:60px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:10px; border:2px solid #ff8c00;}
.xoCell:hover{background:#333;}

/* العجلة */
.wheel-container{position:relative; width:300px; height:300px; margin:20px auto;}
.pointer{width:0; height:0; border-left:20px solid transparent; border-right:20px solid transparent; border-bottom:40px solid #ff0000; position:absolute; top:-15px; left:50%; transform:translateX(-50%); z-index:10; filter:drop-shadow(0 0 5px red);}
#wheel{width:100%; height:100%; border-radius:50%; border:8px solid #ff8c00; position:relative; transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99); box-shadow:0 0 30px #ff8c00;}

.boxItem{width:100px; height:100px; background:linear-gradient(135deg,#ffb300,#ff8c00); margin:10px; display:inline-block; border-radius:15px; cursor:pointer; font-size:40px; line-height:100px; border:3px solid #fff; transition:0.3s;}
.boxItem:hover{transform:scale(1.1);}
.boxItem.opened{background:#333; cursor:not-allowed; transform:scale(0.9);}
</style>
</head>
<body>
<div class="logo">🏛️</div>
<h1>تطبيق الرافدين</h1>

<div class="nav">
  <button class="navBtn" onclick="showPage('store')">المتجر 🛒</button>
  <button class="navBtn active" onclick="showPage('counters')">العدادات ⚙️</button>
  <button class="navBtn" onclick="showPage('games')">الالعاب 🎮</button>
</div>

<div id="counters" class="page active">
  <div class="stats">
    <div class="box"><h3>الرصيد 💰</h3><div id="coins">0 نقطة</div></div>
    <div class="box"><h3>عدد العدادات ⚙️</h3><div id="counterCount">0 عداد</div></div>
    <div class="box"><h3>الارباح التلقائية ⚡</h3><div id="perDay">+0 نقطة/24 ساعة</div></div>
  </div>
  <p id="nextClaim" style="color:#aaa;"></p>
</div>

<div id="store" class="page">
  <h2>🛒 متجر العدادات</h2>
  <div id="coins2" class="box">رصيدك: 0 نقطة</div>
  <div id="storeList"></div>
</div>

<div id="games" class="page">
  <h2>🎮 الالعاب</h2>
  <div id="coins3" class="box">رصيدك: 0 نقطة</div>
  <button class="btn btn-half" onclick="openXO()">❌⭕ XO - 50</button>
  <button class="btn btn-half" onclick="spinWheel()">🎡 العجلة - 50</button>
  <button class="btn btn-half" onclick="openBox()">📦 الصندوق - 500</button>
</div>

<div id="xoModal" class="modal"><div class="modal-content">
  <h2>❌⭕ XO ضد البوت</h2>
  <div id="xoBoard"></div>
  <p id="xoTurn">دورك: X</p>
  <p id="xoResult"></p>
  <button class="btn" onclick="closeModal('xoModal')">خروج</button>
</div></div>

<div id="wheelModal" class="modal"><div class="modal-content">
  <h2>🎡 العجلة</h2>
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>
  <button class="btn" id="spinBtn" onclick="doSpin()">لف - 50</button>
  <p id="wheelResult" style="font-size:20px; color:#ffcc00;"></p>
  <button class="btn" onclick="closeModal('wheelModal')">اغلاق</button>
</div></div>

<div id="boxModal" class="modal"><div class="modal-content">
  <h2>📦 الصندوق الغامض</h2>
  <p>اختر صندوق واحد - الخصم 500 نقطة</p>
  <div id="boxes"></div>
  <p id="boxResult"></p>
  <button class="btn" onclick="closeModal('boxModal')">اغلاق</button>
</div></div>

<script>
let coins = parseInt(localStorage.getItem('rafidain_coins')) || 5000;
let counters = JSON.parse(localStorage.getItem('rafidain_counters_list')) || [];
let lastClaim = parseInt(localStorage.getItem('rafidain_lastClaim')) || 0;
let xoBoard = Array(9).fill('');
let gameOver = false;
let boxOpened = false;

const countersData = [
  {name:"عداد 100", price:1000, profit:100},
  {name:"عداد 200", price:2000, profit:200},
  {name:"عداد 300", price:3000, profit:300},
  {name:"عداد 400", price:4000, profit:400},
  {name:"عداد 500", price:5000, profit:500},
  {name:"عداد 1000", price:10000, profit:1000},
  {name:"عداد 2000", price:20000, profit:2000},
  {name:"عداد 3000", price:30000, profit:3000},
  {name:"عداد 4000", price:40000, profit:4000},
  {name:"عداد 5000", price:50000, profit:5000}
];

const wheelPrizes = [
  {text:"حظ اوفر", value:0, color:"#ff0000"},
  {text:"100", value:100, color:"#ffcc00"},
  {text:"250", value:250, color:"#00ff00"},
  {text:"300", value:300, color:"#00ccff"},
  {text:"1000", value:1000, color:"#ff00ff"},
  {text:"5000", value:5000, color:"#ffb300"}
];

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if(id=='store') loadStore();
  updateAll();
}

function getTotalPerDay(){return counters.reduce((a,b)=>a+b,0);}
function getCounterCount(){return counters.length;}

function updateAll(){
  let totalPerDay = getTotalPerDay();
  document.getElementById('coins').innerText = coins.toLocaleString() + ' نقطة';
  document.getElementById('coins2').innerText = 'رصيدك: ' + coins.toLocaleString() + ' نقطة';
  document.getElementById('coins3').innerText = 'رصيدك: ' + coins.toLocaleString() + ' نقطة';
  document.getElementById('counterCount').innerText = getCounterCount() + ' عداد';
  document.getElementById('perDay').innerText = '+' + totalPerDay.toLocaleString() + ' نقطة/24 ساعة';

  let now = Date.now();
  let timeLeft = 24*60*60*1000 - (now - lastClaim);
  if(timeLeft <= 0 && totalPerDay > 0){
    coins += totalPerDay;
    lastClaim = now;
    alert(`تم اضافة ${totalPerDay.toLocaleString()} نقطة من العدادات!`);
  }
  let hours = Math.floor(timeLeft/1000/60/60);
  let mins = Math.floor((timeLeft/1000/60)%60);
  document.getElementById('nextClaim').innerText = totalPerDay>0? `الارباح الجاية بعد: ${hours}س ${mins}د` : '';

  localStorage.setItem('rafidain_coins', coins);
  localStorage.setItem('rafidain_counters_list', JSON.stringify(counters));
  localStorage.setItem('rafidain_lastClaim', lastClaim);
}
updateAll();
setInterval(updateAll, 60000);
function closeModal(id){document.getElementById(id).style.display='none';}

function loadStore(){
  let html = '';
  countersData.forEach((c)=>{
    html += `<div class="counterItem"><h4>${c.name}</h4><p>السعر: ${c.price.toLocaleString()} نقطة</p><p>الربح: ${c.profit.toLocaleString()} نقطة كل 24 ساعة</p><button class="btn" onclick="buyCounter(${c.price}, ${c.profit})" ${coins<c.price?'disabled':''}>شراء</button></div>`;
  });
  document.getElementById('storeList').innerHTML = html;
}

function buyCounter(price, profit){
  if(coins < price){alert("ما عندك نقاط كافية"); return;}
  coins -= price;
  counters.push(profit);
  updateAll();
  loadStore();
  alert(`✅ تم شراء العداد! صار عندك ${getCounterCount()} عداد`);
}

// XO
function openXO(){
  if(coins<50){alert("ما عندك 50");return;}
  coins-=50; updateAll();
  xoBoard = Array(9).fill('');
  gameOver = false;
  document.getElementById('xoModal').style.display='block';
  document.getElementById('xoResult').innerText = '';
  renderXO();
}
function renderXO(){
  let b = document.getElementById('xoBoard'); b.innerHTML='';
  xoBoard.forEach((cell,i)=>{
    let div = document.createElement('div');
    div.className = 'xoCell';
    div.innerText = cell;
    div.onclick = ()=>playXO(i);
    b.appendChild(div);
  });
  document.getElementById('xoTurn').innerText = gameOver? '' : `دورك: X`;
}
function playXO(i){
  if(xoBoard[i]!='' || gameOver) return;
  xoBoard[i] = 'X';
  if(checkWinner('X')){coins+=200; document.getElementById('xoResult').innerText="فزت! +200 نقطة"; gameOver=true; updateAll(); renderXO(); return;}
  if(!xoBoard.includes('')){document.getElementById('xoResult').innerText="تعادل"; gameOver=true; renderXO(); return;}
  botMove();
}
function botMove(){
  let empty = xoBoard.map((v,i)=>v==''?i:null).filter(v=>v!==null);
  let move = empty[Math.floor(Math.random()*empty.length)];
  xoBoard[move] = 'O';
  if(checkWinner('O')){document.getElementById('xoResult').innerText="خسرت!"; gameOver=true;}
  else if(!xoBoard.includes('')){document.getElementById('xoResult').innerText="تعادل"; gameOver=true;}
  renderXO();
}
function checkWinner(p){
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return wins.some(w=>w.every(i=>xoBoard[i]==p));
}

// العجلة مصححة 100%
function spinWheel(){
  if(coins<50){alert("ما عندك 50");return;}
  coins-=50; updateAll();
  document.getElementById('wheelModal').style.display='block';
  document.getElementById('wheelResult').innerText = '';
  drawWheel();
}

function drawWheel(){
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const centerX = 150;
  const centerY = 150;
  const radius = 140;
  const segmentAngle = 2*Math.PI / wheelPrizes.length;

  ctx.clearRect(0,0,300,300);

  wheelPrizes.forEach((p,i)=>{
    const startAngle = i * segmentAngle - Math.PI/2; // نبلش من فوك يم السهم
    const endAngle = (i+1) * segmentAngle - Math.PI/2;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.stroke();

    // النص
    const textAngle = startAngle + segmentAngle/2;
    const textX = centerX + Math.cos(textAngle) * 80;
    const textY = centerY + Math.sin(textAngle) * 80;
    ctx.save();
    ctx.translate(textX, textY);
    ctx.rotate(textAngle + Math.PI/2);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 18px tahoma';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  });
}

function doSpin(){
  document.getElementById('spinBtn').disabled = true;
  let randomIndex = Math.floor(Math.random()*wheelPrizes.length);
  let segmentAngle = 360 / wheelPrizes.length;

  // الحساب المضبوط: نخلي نص القسم يوكف تحت السهم
  let degrees = randomIndex * segmentAngle;
  let targetDeg = 3600 + (360 - degrees) + segmentAngle/2;

  document.getElementById('wheel').style.transition = 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
  document.getElementById('wheel').style.transform = `rotate(${targetDeg}deg)`;

  setTimeout(()=>{
    let prize = wheelPrizes[randomIndex];
    if(prize.value>0){coins+=prize.value;}
    document.getElementById('wheelResult').innerText = prize.value>0?`🎉 ربحت ${prize.text} نقطة`:`💀 ${prize.text}`;
    updateAll();
    document.getElementById('spinBtn').disabled = false;
  },5000);
}

// الصندوق
function openBox(){
  if(coins<500){alert("ما عندك 500");return;}
  coins-=500; updateAll();
  boxOpened = false;
  document.getElementById('boxModal').style.display='block';
  document.getElementById('boxResult').innerText = 'اختار صندوق واحد';
  let boxes = document.getElementById('boxes');
  boxes.innerHTML = '';
  let winningBox = Math.floor(Math.random()*3)+1;
  let prize = Math.floor(Math.random()*4901)+100;

  for(let i=1; i<=3; i++){
    let div = document.createElement('div');
    div.className = 'boxItem';
    div.innerText = '?';
    div.dataset.isWinner = i==winningBox;
    div.dataset.prize = prize;
    div.onclick = ()=>openMysteryBox(div);
    boxes.appendChild(div);
  }
}
function openMysteryBox(el){
  if(boxOpened) return;
  boxOpened = true;
  let isWinner = el.dataset.isWinner=='true';
  let prize = parseInt(el.dataset.prize);

  document.querySelectorAll('.boxItem').forEach(b=>b.classList.add('opened'));

  if(isWinner){
    coins+=prize;
    el.innerText = prize;
    document.getElementById('boxResult').innerText = `🎉 مبروك! ربحت ${prize.toLocaleString()} نقطة`;
  }else{
    el.innerText = '💀';
    document.getElementById('boxResult').innerText = `خسارة! الصندوق كان فاضي`;
  }
  updateAll();
}
</script>
</body></html>
