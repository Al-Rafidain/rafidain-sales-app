<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الرافدين الكامل</title>
<style>
body{background:linear-gradient(135deg,#0a1a3a,#0066ff);color:white;font-family:Tahoma;padding:15px;padding-bottom:80px}
.card{background:rgba(0,0,0,0.4);margin:15px auto;padding:20px;border-radius:20px;max-width:500px}
.points{font-size:45px;color:#00ff88;text-align:center}
button{background:#0066ff;color:white;border:0;padding:14px;font-size:16px;border-radius:12px;margin:6px 0;width:100%;font-weight:bold;cursor:pointer}
button:disabled{background:#555}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1a3a;display:flex}
.nav button{flex:1;font-size:12px;background:none}
.page{display:none}.page.active{display:block}
.task,.shop{background:rgba(255,255,255,0.1);padding:12px;margin:8px 0;border-radius:12px;display:flex;justify-content:space-between}
.event{background:#ff0;color:#000;padding:10px;border-radius:10px;font-weight:bold;text-align:center}
.time{font-size:22px;color:#ff0;text-align:center}
.wheel{width:200px;height:200px;border-radius:50%;margin:15px auto;border:8px solid #ff0;background:conic-gradient(#06f 0 60deg,#0f8 60deg 120deg,#f06 120deg 180deg,#ff0 180deg 240deg,#90f 240deg 300deg,#0cf 300deg 360deg);transition:4s}
</style>
</head>
<body>

<div id="home" class="page active">
<div class="card">
<div id="event"></div>
<h2>رصيدك</h2>
<div class="points" id="points">1000</div>
<div class="time" id="timer">23:59:59</div>
<button id="collectBtn" onclick="collect()">اجمع 100 نقطة</button>
</div>
</div>

<div id="games" class="page">
<div class="card">
<h2>العاب</h2>
<div class="wheel" id="wheel">لف</div>
<button onclick="spin()">عجلة الحظ -50</button>
<button onclick="xo()">XO -50</button>
<button onclick="box()">صندوق غامض -500</button>
</div>
</div>

<div id="tasks" class="page">
<div class="card">
<h2>المهام <span id="taskTimer" style="color:#ff0;font-size:12px"></span></h2>
<div id="taskList"></div>
<h2>الاحالة</h2>
<input id="refInput" placeholder="كود صديقك" style="padding:10px;width:60%;border-radius:8px">
<button onclick="useRef()" style="width:35%">تفعيل</button>
<p>كودك: <b id="myCode"></b></p>
</div>
</div>

<div id="shop" class="page">
<div class="card">
<h2>متجر العدادات</h2>
<div id="shopList"></div>
</div>
</div>

<div id="board" class="page">
<div class="card">
<h2>المتصدرين</h2>
<div id="leader"></div>
</div>
</div>

<div class="nav">
<button onclick="show('home')">العداد</button>
<button onclick="show('games')">العاب</button>
<button onclick="show('tasks')">مهام</button>
<button onclick="show('shop')">متجر</button>
<button onclick="show('board')">متصدرين</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('rafidain3')) || {
points:1000, rate:100, last:0, myCode:'RAF'+Math.floor(Math.random()*9000),
usedRef:false, tasks:[], taskEnd:0
};

let allTasks100 = [];
for(let i=1;i<=100;i++){
allTasks100.push({text:`مهمة ${i}: اجمع ${Math.floor(Math.random()*10)+1} مرات`,type:"collect",need:Math.floor(Math.random()*10)+1,reward:Math.floor(Math.random()*2000)+500});
}
allTasks100.push({text:"العب XO",type:"game",need:1,reward:500});
allTasks100.push({text:"افتح صندوق",type:"box",need:1,reward:800});
allTasks100.push({text:"اشتري عداد",type:"buy",need:1,reward:2000});

function save(){localStorage.setItem('rafidain3', JSON.stringify(data));}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}

function update(){
document.getElementById('points').innerText = data.points.toLocaleString();
document.getElementById('myCode').innerText = data.myCode;

// حدث الجمعة
document.getElementById('event').innerHTML = new Date().getDay()==5? '<div class="event">الجمعة: جمع ×2</div>' : '';
let mult = new Date().getDay()==5? 2:1;

// تايمر الجمع
let left = 86400000 - (Date.now() - data.last);
if(left<0) left=0;
let h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);
document.getElementById('timer').innerText = `${h}:${m}:${s}`;
document.getElementById('collectBtn').disabled = left>0;
document.getElementById('collectBtn').innerText = left<=0? `اجمع ${data.rate*mult} نقطة` : 'انتظر';

// المهام تتجدد كل 24 ساعة
if(Date.now() > data.taskEnd || data.tasks.length==0){
data.tasks = allTasks100.sort(()=>0.5-Math.random()).slice(0,3).map(t=>({...t,prog:0,done:false}));
data.taskEnd = Date.now() + 86400000;
}
let tLeft = data.taskEnd - Date.now();
document.getElementById('taskTimer').innerText = `تتجدد بعد ${Math.floor(tLeft/3600000)}س`;

let tHtml='';
data.tasks.forEach((t,i)=>{
tHtml+=`<div class="task"><span>${t.text}<br><small>+${t.reward}</small></span><button onclick="claim(${i})" ${t.prog<t.need?'disabled':''}>${t.done?'تم':t.prog+'/'+t.need}</button></div>`;
});
document.getElementById('taskList').innerHTML=tHtml;

// المتجر
let shop='';
[100,200,300,400,500,1000,2000,3000,4000,5000].forEach((r,i)=>{
let p=(i+1)*1000;
shop+=`<div class="shop"><span>عداد ${r}</span><button onclick="buy(${r},${p})" ${data.points<p?'disabled':''}>${p.toLocaleString()}</button></div>`;
});
document.getElementById('shopList').innerHTML=shop;

// المتصدرين
let top=[{n:'انت',p:data.points},{n:'احمد',p:125000},{n:'علي',p:98000}].sort((a,b)=>b.p-a.p);
document.getElementById('leader').innerHTML = top.map((x,i)=>`<div class="shop"><span>#${i+1} ${x.n}</span><b>${x.p.toLocaleString()}</b></div>`).join('');
}

function collect(){
if(Date.now()-data.last<86400000) return;
let mult = new Date().getDay()==5? 2:1;
data.points += data.rate*mult;
data.last = Date.now();
data.tasks.forEach(t=>{if(t.type=="collect") t.prog++;});
save(); update();
}

function buy(r,p){
if(data.points<p) return alert('ماعندك نقاط');
data.points-=p; data.rate=r;
data.tasks.forEach(t=>{if(t.type=="buy") t.prog++;});
save(); update(); alert('تم شراء عداد '+r);
}

function spin(){
if(data.points<50) return alert('تحتاج 50');
data.points-=50;
let win = [50,100,200,500,1000][Math.floor(Math.random()*5)];
data.points+=win;
data.tasks.forEach(t=>{if(t.type=="game") t.prog++;});
save(); update();
document.getElementById('wheel').style.transform=`rotate(${1800+Math.random()*360}deg)`;
setTimeout(()=>alert('ربحت '+win),4000);
}

function xo(){
if(data.points<50) return alert('تحتاج 50');
data.points-=50;
let win = Math.random()>0.4? 1000:0;
data.points+=win;
data.tasks.forEach(t=>{if(t.type=="game") t.prog++;});
save(); update(); alert(win? 'فزت +1000':'خسرت');
}

function box(){
if(data.points<500) return alert('تحتاج 500');
data.points-=500;
let win = [100,500,1000,2000,5000][Math.floor(Math.random()*5)];
data.points+=win;
data.tasks.forEach(t=>{if(t.type=="box") t.prog++;});
save(); update(); alert('ربحت '+win);
}

function claim(i){
if(data.tasks[i].prog>=data.tasks[i].need &&!data.tasks[i].done){
data.points += data.tasks[i].reward;
data.tasks[i].done=true;
save(); update();
}
}

function useRef(){
let code = document.getElementById('refInput').value;
if(code &&!data.usedRef && code!=data.myCode){
data.points+=5000; data.usedRef=true; save(); update();
alert('تم +5000 نقطة');
}else alert('الكود غلط');
}

setInterval(update,1000); update();
</script>
</body>
</html>
