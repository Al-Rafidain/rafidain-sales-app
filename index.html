<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogItmF2LPYs9mGINiq2YLYs9mK2YYiLAogICJzaG9ydF9uYW1lIjogItmF2LPYs9mGINiq2YIiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwYTBmMWUiLAogICJ0aGVtZV9jb2xvciI6ICIjMGExZjFlIiwKICAiaWNvbnMiOiBbeyJzcmMiOiAiaHR0cHM6Ly9pLmltZ3VyLmNvbS9BNlR6U2dRLnBuZyIsInNpemVzIjogIjE5MjgxOTIiLCJ0eXBlIjogImltYWdlL3BuZyJ9XX0=">
<title>الرافدين</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:#000;color:#fff;padding-bottom:70px}
.app{max-width:420px;margin:auto;background:#0a0f1e;min-height:100vh}
.card{background:#1a1f36;margin:12px;padding:20px;border-radius:16px}
h2{text-align:center;color:#00e5ff;margin-bottom:10px}
.points{font-size:50px;color:#22c55e;text-align:center;font-weight:bold;margin:10px 0}
.timer{text-align:center;margin:8px 0;font-size:16px}
.btn{background:#2563eb;color:#fff;border:0;padding:14px;width:100%;border-radius:12px;margin:8px 0;font-size:16px;font-weight:bold;cursor:pointer}
.btn:active{background:#1d4ed8}
.btn:disabled{background:#333}
.wheel{width:220px;height:220px;border-radius:50%;border:8px solid #facc15;background:conic-gradient(red 0 60deg,green 60 120,blue 120 180,yellow 180 240,purple 240 300,cyan 300 360);margin:15px auto;transition:4s cubic-bezier(.23,1,.32,1)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:260px;margin:15px auto}
.cell{background:#222;height:80px;font-size:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:auto;background:#0a0f2e;display:flex;border-top:1px solid #1e3a8a}
.nav button{flex:1;background:none;border:0;color:#aaa;padding:10px 0;font-size:12px;cursor:pointer}
.nav button.active{color:#00e5ff}
.page{display:none}.page.active{display:block}
</style>
</head>
<body>
<div class="app">
<!-- صفحة 1: العداد -->
<div id="home" class="page active">
<div class="card">
<h2>🔥 الرافدين 🔥</h2>
<p style="text-align:center">رصيدك</p>
<div class="points" id="points">1000</div>
<div class="timer" id="timer">الوقت: 00:00:00</div>
<button class="btn" id="collectBtn" onclick="collect()">اجمع 100</button>
</div>
</div>

<!-- صفحة 2: الالعاب -->
<div id="games" class="page">
<div class="card">
<h3 style="text-align:center">الالعاب</h3>
<div id="wheelBox" style="display:none;text-align:center">
<div class="wheel" id="wheel"></div>
<p id="wheelResult"></p>
</div>
<div id="xoBox" style="display:none">
<h4 style="text-align:center;margin-bottom:10px">XO ضد البوت</h4>
<div class="board" id="board"></div>
<button class="btn" onclick="resetXO()">لعبة جديدة</button>
<p id="xoResult" style="text-align:center;margin-top:10px"></p>
</div>
<button class="btn" onclick="spin()">عجلة الحظ -50</button>
<button class="btn" onclick="startXO()">XO -50</button>
<button class="btn" onclick="box()">صندوق الحظ -500</button>
</div>
</div>

<!-- صفحة 3: المتجر - كل العدادات -->
<div id="shop" class="page">
<div class="card">
<h3 style="text-align:center">المتجر</h3>
<button class="btn" onclick="buy(100,1000)">+100 عداد = 1000 نقطة</button>
<button class="btn" onclick="buy(200,2000)">+200 عداد = 2000 نقطة</button>
<button class="btn" onclick="buy(300,3000)">+300 عداد = 3000 نقطة</button>
<button class="btn" onclick="buy(400,4000)">+400 عداد = 4000 نقطة</button>
<button class="btn" onclick="buy(500,5000)">+500 عداد = 5000 نقطة</button>
<button class="btn" onclick="buy(1000,10000)">+1000 عداد = 10000 نقطة</button>
<button class="btn" onclick="buy(2000,20000)">+2000 عداد = 20000 نقطة</button>
<button class="btn" onclick="buy(3000,30000)">+3000 عداد = 30000 نقطة</button>
<button class="btn" onclick="buy(4000,40000)">+4000 عداد = 40000 نقطة</button>
<button class="btn" onclick="buy(5000,50000)">+5000 عداد = 50000 نقطة</button>
</div>
</div>

</div>

<!-- شريط التنقل -->
<div class="nav">
<button onclick="go('home')" id="nav-home" class="active">العداد</button>
<button onclick="go('games')" id="nav-games">الالعاب</button>
<button onclick="go('shop')" id="nav-shop">المتجر</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('rafidain')) || {points: 1000,rate: 100,last: 0};
let board = ['','',''];let gameOver = false;

function save(){localStorage.setItem('rafidain', JSON.stringify(data));}

function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+page).classList.add('active');
  if(page=='games'){document.getElementById('wheelBox').style.display='none';document.getElementById('xoBox').style.display='none';}
}

function update(){
  document.getElementById('points').innerText = data.points;
  let left = 86400000 - (Date.now() - data.last);
  if(left<0) left=0;
  let h = String(Math.floor(left/3600000)).padStart(2,'0');
  let m = String(Math.floor((left%3600000)/60000)).padStart(2,'0');
  let s = String(Math.floor((left%60000)/1000)).padStart(2,'0');
  document.getElementById('timer').innerText = `الوقت: ${h}:${m}:${s}`;
  document.getElementById('collectBtn').innerText = `اجمع ${data.rate}`;
  document.getElementById('collectBtn').disabled = left>0;
}

function collect(){
  if(Date.now()-data.last < 86400000) return alert('انتظر 24 ساعة');
  data.points += data.rate;data.last = Date.now();save();update();
}

function buy(r,p){
  if(data.points<p) return alert('ماعندك نقاط كافية');
  data.points -= p;data.rate += r;save();update();alert(`تم شراء +${r} عداد`);
}

function spin(){
  if(data.points<50) return alert('تحتاج 50 نقطة');
  data.points -= 50;
  document.getElementById('wheelBox').style.display='block';
  document.getElementById('xoBox').style.display='none';
  document.getElementById('wheelResult').innerText='جاري الدوران...';
  document.getElementById('wheel').style.transform = 'rotate('+(1800+Math.random()*360)+'deg)';
  let rewards = [100,200,500,1000];
  let win = rewards[Math.floor(Math.random()*4)];
  setTimeout(()=>{
    data.points += win;save();update();
    document.getElementById('wheelResult').innerText=`مبروك ربحت ${win} نقطة`;
  },4000);
}

function startXO(){
  if(data.points<50) return alert('تحتاج 50 نقطة');
  data.points -= 50;save();update();
  gameOver=false;board = ['','',''];
  document.getElementById('xoBox').style.display='block';
  document.getElementById('wheelBox').style.display='none';
  document.getElementById('xoResult').innerText='';
  renderXO();
}

function renderXO(){
  let html='';
  for(let i=0;i<9;i++) html += `<div class="cell" onclick="playXO(${i})">${board[i]}</div>`;
  document.getElementById('board').innerHTML = html;
}

function playXO(i){
  if(board[i]||gameOver) return;
  board[i]='X';
  if(checkWin('X')){gameOver=true; data.points+=1000; save(); update(); document.getElementById('xoResult').innerText='فزت +1000 نقطة'; renderXO(); return;}
  let empty = board.map((v,j)=>v?'':j).filter(x=>x!=='');
  if(empty.length){
    board[empty[Math.floor(Math.random()*empty.length)]]='O';
    if(checkWin('O')){gameOver=true; document.getElementById('xoResult').innerText='خسرت حاول مرة اخرى';}
  }
  if(!board.includes('')&&!gameOver){document.getElementById('xoResult').innerText='تعادل';}
  renderXO();
}

function checkWin(p){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(x=>x.every(i=>board[i]==p));}
function resetXO(){startXO();}

function box(){
  if(data.points<500) return alert('تحتاج 500 نقطة');
  data.points -= 500;
  let win = [100,500,1000,2000][Math.floor(Math.random()*4)];
  data.points += win;save();alert(`ربحت ${win} نقطة`);update();
}

setInterval(update,1000);update();
</script>
</body>
</html>
